                    }
                },
                "Projection": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Converts native, zero-based Tiled cell coordinates to displayed pixels.\n    Covers orthogonal, isometric, staggered, hexagonal and oblique map grids.\n    Pixel coordinates here are displayed map coordinates, not TMX object coordinates.<\/div><\/div><\/div>`,
                    "subtable": {
                    "geometry": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Mirrors Tiled's integer side-offset calculation. Odd tile dimensions can lose\n    one pixel in the staggered grid footprint; image dimensions remain unchanged.<\/div><\/div><div class=\"custom-section\"><div id=\"e871281f-2d11-c5d6-ce7e-3c4b2982e1e7\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nWidth<\/em>   Grid footprint width.   <strong><em>number<\/em><\/strong>   <em>nHeight<\/em>   Grid footprint height.   <strong><em>number<\/em><\/strong>   <em>nSide<\/em>   Hex side length, or zero for staggered diamonds.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "origin": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the top-left bounding-box corner of a staggered cell.<\/div><\/div><div class=\"custom-section\"><div id=\"65ca8ddc-a191-dcdf-c6e5-7cad37c973bf\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tMap<\/em>   Parsed map attributes.   <strong><em>number<\/em><\/strong>   <em>nX<\/em>   Native column, including negative columns.   <strong><em>number<\/em><\/strong>   <em>nY<\/em>   Native row, including negative rows.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e6fe5d37-adab-9666-7ba9-996b2d9ded7c\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nPixelX<\/em>   Horizontal pixel position.   <strong><em>number<\/em><\/strong>   <em>nPixelY<\/em>   Vertical pixel position.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "pixelToTile": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Locates the cell containing a displayed pixel, including outside finite bounds.\n    Shared polygon edges use deterministic column/row iteration order.<\/div><\/div><div class=\"custom-section\"><div id=\"94c80182-0e2e-dbd5-3ac0-4138e6822aa2\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tMap<\/em>   Parsed map attributes.   <strong><em>number<\/em><\/strong>   <em>nPixelX<\/em>   Displayed x.   <strong><em>number<\/em><\/strong>   <em>nPixelY<\/em>   Displayed y.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b1eb0e9d-f0f6-4795-3b09-90c2b17f583d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nX<\/em>   Native column.   <strong><em>number<\/em><\/strong>   <em>nY<\/em>   Native row.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "tileToPixel": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a cell's displayed center. This common anchor works for all orientations.<\/div><\/div><div class=\"custom-section\"><div id=\"f0608e99-ccb5-4d57-3346-53d824905fef\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tMap<\/em>   Parsed map attributes.   <strong><em>number<\/em><\/strong>   <em>nX<\/em>   Native column.   <strong><em>number<\/em><\/strong>   <em>nY<\/em>   Native row.<br><\/div><\/div><div class=\"custom-section\"><div id=\"55c7989e-e43c-7854-8625-028d3480d866\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nPixelX<\/em>   Cell center x.   <strong><em>number<\/em><\/strong>   <em>nPixelY<\/em>   Cell center y.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    }
                    }
                },
                "Reader": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Interprets TMX/TSX/XML templates without adding Tiled behavior to XML.\n    Canonical XML trees retain unknown elements and attributes. Tile payloads are\n    normalized to CSV so editing and snapshots do not depend on a decompressor.<\/div><\/div><\/div>`,
                    "subtable": {
                    "append": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Appends a child to both XML indexes, preserving their shared reference.<\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "attributes": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Copies raw attributes and converts known numeric and visibility fields.\n    Unknown attributes retain their original strings.<\/div><\/div><div class=\"custom-section\"><div id=\"60c221a0-0966-e5a2-4f72-9c3098c4ae13\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tAttributes<\/em>   Interpreted attribute values.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "cell": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Finds a native cell in a finite block or infinite chunk. Empty GID 0 differs\n    from an absent cell, which returns nil.<\/div><\/div><div class=\"custom-section\"><div id=\"3f21b784-f3a7-7865-959e-bcf57bc985ae\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nGID<\/em>   Raw tile ID.   <strong><em>table|nil<\/em><\/strong>   <em>tChunk<\/em>   Containing chunk.   <strong><em>number|nil<\/em><\/strong>   <em>nIndex<\/em>   Row-major position in that chunk.<br><\/div><\/div><\/div>`,

                    },
                    "child": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Finds the first direct XML child with an exact element name.<\/div><\/div><div class=\"custom-section\"><div id=\"534c8a88-bb23-c914-a7ad-ef020796aad0\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table|nil<\/em><\/strong>   <em>tChild<\/em>   Matching element.<br><\/div><\/div><\/div>`,

                    },
                    "compile": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Validates a map tree and builds query indexes. Callers supply a disposable tree\n    and resource cache so loading and editing can commit atomically after success.<\/div><\/div><div class=\"custom-section\"><div id=\"ec0be50b-ff91-d3dd-07f7-f46f2499fb1e\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tMap<\/em>   Compiled map, referencing its canonical editable tree.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "decodeData": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Decodes a finite payload or chunk, validates every GID and normalizes XML to CSV.\n    Compression is delegated to the host callback (bytes, format, expectedByteCount).<\/div><\/div><div class=\"custom-section\"><div id=\"8db3ec3e-4b4c-5294-3b00-3507ab2ceae2\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tGIDs<\/em>   Ordered row-major GIDs.<br><\/div><\/div><\/div>`,

                    "decodeGID": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Separates all four high GID flags, including hexagonal rotation flags.<\/div><\/div><div class=\"custom-section\"><div id=\"9b2ba702-9df0-c4b3-2ef4-dea173669106\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tGID<\/em>   Raw GID, base ID and transformation booleans.<br><\/div><\/div><\/div>`,

                    },
                    "element": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates a new XML element with independent attribute, child and content tables.<\/div><\/div><div class=\"custom-section\"><div id=\"498fe554-eb2d-40f4-6c4d-af80bbd57911\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tElement<\/em>   Editable XML element.<br><\/div><\/div><\/div>`,

                    },
                    "encode": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Writes a canonical element tree as UTF-8 XML. Attributes are sorted for stable\n    output; unknown elements, text, comments and processing instructions survive editing.<\/div><\/div><div class=\"custom-section\"><div id=\"886d4cb1-85ff-3672-26ac-146dbed5cbcd\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sXML<\/em>   Serialized XML element.<br><\/div><\/div><\/div>`,

                    "escape": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Escapes XML text and attributes, retaining literal attribute whitespace via references.<\/div><\/div><div class=\"custom-section\"><div id=\"d2e72c91-27d4-d7f1-ef9f-5e9769734f32\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sEscaped<\/em>   XML-safe text.<br><\/div><\/div><\/div>`,

                    "insertTileset": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Inserts a tileset before layers so Tiled encounters GID definitions before\n    object/layer references when opening exported XML.<\/div><\/div><\/div>`,

                    "layer": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Finds a layer by ID or unique exact name. Ambiguous names require an ID.<\/div><\/div><div class=\"custom-section\"><div id=\"3de53589-21c0-88e0-db3e-1ceb8af89769\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table|nil<\/em><\/strong>   <em>tLayer<\/em>   Matching layer.<br><\/div><\/div><\/div>`,

                    "number": {

                    "path": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Resolves a resource relative to its containing file, normalizing separators\n    and dot segments. Does not apply a filesystem access policy.<\/div><\/div><div class=\"custom-section\"><div id=\"95238059-832e-141d-80ce-6340fd1f4168\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sPath<\/em>   Resource path for the host reader.<br><\/div><\/div><\/div>`,

                    "properties": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Reads named properties as records retaining type, propertytype, value and raw XML.\n    Class values contain named property records; lists contain ordered property records.<\/div><\/div><div class=\"custom-section\"><div id=\"8eebdf8e-13cf-9778-e1d0-309bbbf16983\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tProperties<\/em>   Named typed properties.<br><\/div><\/div><\/div>`,

                    "propertyNode": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Builds typed XML properties from plain Lua values. Nested tables become class\n    properties unless type=list is explicitly requested; cycles are rejected by the caller.<\/div><\/div><div class=\"custom-section\"><div id=\"7197f59e-45d1-bf76-2b2e-2c07e99d6a84\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tNode<\/em>   Property or item element.<br><\/div><\/div><\/div>`,

                    "readFile": {

                    "readLayers": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Walks nested layers in draw order, combining visibility, opacity, offsets and\n    parallax. Finite layers and infinite chunks keep zero-based native coordinates.<\/div><\/div><\/div>`,

                    "readValue": {

                    "rebase": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Moves an element's file references between containing files, including nested\n    class/list file properties. Object IDs and ordinary string properties remain unchanged.<\/div><\/div><\/div>`,

                    },
                    "record": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Interprets an XML element while keeping its raw node for editing and export.<\/div><\/div><div class=\"custom-section\"><div id=\"11631dbf-bf7d-d1de-6b66-b8ced6b74868\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tRecord<\/em>   Attributes, typed properties and raw source node.<br><\/div><\/div><\/div>`,

                    "relative": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Expresses a resolved resource relative to another containing filename.\n    Different absolute roots retain an absolute reference. Absolute and relative map\n    filenames must not be mixed because Lua provides no portable current-directory API.<\/div><\/div><div class=\"custom-section\"><div id=\"fa00b93b-abe4-eba4-326e-ba085296a814\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sReference<\/em>   Rebased file reference.<br><\/div><\/div><\/div>`,

                    },
                    "remove": {

                    "resolve": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Resolves a raw GID against ascending tilesets. Empty cells have no tileset.\n    Sparse image collections require an explicitly defined local tile.<\/div><\/div><div class=\"custom-section\"><div id=\"37ed97e8-d64f-d0fe-6bfa-ceb82fcf9b1b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tTile<\/em>   Transformation flags, tileset and optional explicit tile definition.<br><\/div><\/div><\/div>`,

                    },
                    "resource": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Obtains an XML resource from the per-map cache or the host file reader.\n    Cached XML trees are copied before use so failed edits cannot alter saved resources.<\/div><\/div><div class=\"custom-section\"><div id=\"172ef99a-1e82-2dae-e09a-120cc3214c04\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tRoot<\/em>   Resource root element.<br><\/div><\/div><\/div>`,

                    },
                    "templateObject": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Expands template defaults and instance overrides. Template tile GIDs are remapped\n    into the map's tileset range; template cycles are rejected.<\/div><\/div><div class=\"custom-section\"><div id=\"2f3245e9-fb66-bfb1-8229-e7a6f9c33e37\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tObject<\/em>   Expanded object element, independent of the template cache.<br><\/div><\/div><\/div>`,

                    },
                    "text": {

                    "tileset": {

                    },
                    "values": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Unwraps typed properties into plain values for application callbacks.\n    The regular property queries retain the original type metadata.<\/div><\/div><div class=\"custom-section\"><div id=\"f58d526d-ab53-12b3-c314-4094a8bc0e15\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tValues<\/em>   Plain nested property values.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    }
                    }
                },
                "checkValue": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Rejects cyclic property tables, unsupported values and excessive recursion.\n    Shared acyclic tables are permitted and copied independently into XML properties.<\/div><\/div><\/div>`,
                    "subtable": null
                },
                "commit": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Parses and compiles temporary state before replacing the object's map.\n    Source is regenerated after compilation so normalized payloads and expanded templates\n    survive cloning and native serialization without a decompressor or file access.<\/div><\/div><\/div>`,
                    "subtable": null
                },
                "makeElement": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates an element from {attributes, properties, children}. Plain properties\n    infer scalar/class types; explicit typed properties can be supplied as raw children.<\/div><\/div><div class=\"custom-section\"><div id=\"3442cfd5-92ee-a572-c96a-1bf3db2a2c6a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tElement<\/em>   Independent editable element.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "nextID": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Chooses an unused positive layer/object ID and respects the map's next-ID hint.<\/div><\/div><div class=\"custom-section\"><div id=\"1e0f3ed3-8cfd-19a8-afdb-8c671b9da334\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nID<\/em>   New ID.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "prepareSnapshot": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Omits the derived query indexes; canonical XML and cached resources persist.<\/div><\/div><\/div>`,
                    "subtable": null
                },
                "putProperty": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Replaces one named property in both XML indexes, or removes it for nil.<\/div><\/div><\/div>`,
                    "subtable": null
                },
                "requireMap": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks that the object contains a loaded or programmatically created map.<\/div><\/div><div class=\"custom-section\"><div id=\"70a66685-a62a-9c02-cd8a-e545337e8c0e\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tMap<\/em>   Compiled private map.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "target": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Selects map, layer or object XML for property edits. Object ID takes precedence;\n    the layer selector may be omitted for object properties.<\/div><\/div><div class=\"custom-section\"><div id=\"934d07f0-c974-c16e-bd1d-2c93231409e9\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tNode<\/em>   Canonical target node.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "validateSnapshot": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Rebuilds query indexes from saved XML without reading external files.<\/div><\/div><\/div>`,
                    "subtable": null
                }
                }

            "Metamethods": {

                "__tostring": {

            "Methods": {
                "value": ``,
                "subtable": {
                "Tiled": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates an unloaded object or loads a TMX file immediately.<\/div><\/div><div class=\"custom-section\"><div id=\"ebcbb675-7319-12dd-713b-d592a625de0e\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string|nil<\/em><\/strong>   <em>sPath<\/em>   Optional map path.   <strong><em>function|nil<\/em><\/strong>   <em>fRead<\/em>   Optional resource reader (path) returning XML text.   <strong><em>function|nil<\/em><\/strong>   <em>fDecompress<\/em>   Optional decoder (bytes, format, expectedByteCount).<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "addLayer": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adds a tile, object, image or group layer. Settings use\n        {kind, attributes, properties, children}; kind defaults to layer. A parent selector\n        must identify a group. New finite tile layers contain empty GIDs.<\/div><\/div><div class=\"custom-section\"><div id=\"be97b7f6-eb84-0a1d-42b0-55e7e0f6962f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tDefinition<\/em>   Layer settings.   <strong><em>number|string|nil<\/em><\/strong>   <em>vParent<\/em>   Optional parent group ID/name.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8cecce87-4854-2153-1a8a-f02d828f7880\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nID<\/em>   Assigned layer ID.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "addObject": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adds an object to an object layer from {attributes, properties, children}.\n        Shape elements, text, tile GIDs and templates may be supplied in the definition.<\/div><\/div><div class=\"custom-section\"><div id=\"52baddd1-8290-8422-b519-cd25f3189109\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|string<\/em><\/strong>   <em>vLayer<\/em>   Object layer ID or unique name.   <strong><em>table<\/em><\/strong>   <em>tDefinition<\/em>   Object definition.<br><\/div><\/div><div class=\"custom-section\"><div id=\"aa426de7-c034-5df5-cdfe-4ac19749b4d9\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nID<\/em>   Assigned object ID.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "addTileset": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Embeds TSX XML or a definition {attributes, properties, children} into the map.\n        Image/tile/animation children follow the XML element shape exposed by getDocument.\n        Relative image and file paths are interpreted relative to this map.<\/div><\/div><div class=\"custom-section\"><div id=\"e9a7b057-b50f-90f7-5b45-31dedc59cbb5\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string|table<\/em><\/strong>   <em>vDefinition<\/em>   TSX source text or programmatic definition.   <strong><em>number|nil<\/em><\/strong>   <em>nFirstGID<\/em>   Optional GID base; default follows existing ranges.   <strong><em>string|nil<\/em><\/strong>   <em>sSourcePath<\/em>   Optional containing TSX filename for rebasing its paths.<br><\/div><\/div><div class=\"custom-section\"><div id=\"03ba68d0-5d93-17ec-7994-26d6e3c2fa46\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nFirstGID<\/em>   Assigned global tile ID base.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "create": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates/replaces an empty map from attribute settings. Defaults are orthogonal,\n        1 by 1 cells, 32 by 32 pixels, and finite. Hex/staggered maps default to y/odd;\n        hexsidelength defaults to half the tile size along the stagger axis.<\/div><\/div><div class=\"custom-section\"><div id=\"80fba7fc-d076-e0b4-b31e-8ac1e69f6c8f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table|nil<\/em><\/strong>   <em>tSettings<\/em>   TMX map attributes, including orientation and infinite.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1cfa76a7-097f-2c4a-6de6-963feb78813d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Tiled<\/em><\/strong>   <em>this<\/em>   Map object for chaining.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "edit": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Runs a program edit on an independent XML root and commits after validation.\n        This permits editing every TMX field, including advanced tileset/object metadata.\n        Keep children and content indexes consistent: an element appears in both arrays.\n        External resources can be supplied by fRead when an edit introduces references.<\/div><\/div><div class=\"custom-section\"><div id=\"802fa179-13c2-7c78-9b06-44f653d92b82\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>function<\/em><\/strong>   <em>fEdit<\/em>   Callback (rootElement); its return value is ignored.   <strong><em>function|nil<\/em><\/strong>   <em>fRead<\/em>   Optional resource reader for new references.   <strong><em>function|nil<\/em><\/strong>   <em>fDecompress<\/em>   Optional decoder for newly supplied compressed data.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bc25b82c-1fea-de15-659b-cd063be022df\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Tiled<\/em><\/strong>   <em>this<\/em>   Map object for chaining.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getDocument": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Copies the canonical XML map root, retaining unknown TMX fields and elements.<\/div><\/div><div class=\"custom-section\"><div id=\"4a71e3fe-1583-04a9-20be-99dff05b9bbb\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tRoot<\/em>   Independent root for inspection or edit planning.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getLayer": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Copies a layer selected by ID or unique exact name, including effective\n        group offsets/visibility and its finite blocks or infinite chunks.<\/div><\/div><div class=\"custom-section\"><div id=\"f8c5e456-320b-b9d3-1e96-29e7efcfddf2\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|string<\/em><\/strong>   <em>vLayer<\/em>   Layer selector.<br><\/div><\/div><div class=\"custom-section\"><div id=\"21ad69cd-2a74-f3e0-e760-cdc603a8e5f2\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table|nil<\/em><\/strong>   <em>tLayer<\/em>   Layer record, or nil when absent.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getLayers": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Copies all layers in depth-first draw order, including group records.<\/div><\/div><div class=\"custom-section\"><div id=\"04c4f3b5-9400-9e90-687d-496930706970\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tLayers<\/em>   Ordered layer records.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getMap": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Copies interpreted map attributes and typed map properties.<\/div><\/div><div class=\"custom-section\"><div id=\"f89215d8-9fdb-da60-3ec7-0e0c79d56e1c\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tMap<\/em>   Map metadata; layer/tileset queries supply their own records.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getObject": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Copies an object by map-wide ID. Shape, text and other XML remain in raw.<\/div><\/div><div class=\"custom-section\"><div id=\"0c4f935f-9ff5-f669-446d-288b4272de37\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nID<\/em>   Object ID.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c579b723-74dd-4c01-6c6d-0978a04397d7\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table|nil<\/em><\/strong>   <em>tObject<\/em>   Object record, or nil when absent.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getObjects": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Copies all objects or those in one object layer, preserving document order.<\/div><\/div><div class=\"custom-section\"><div id=\"a174b389-2bcc-4c5b-a626-2b5dd8a7a9bc\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|string|nil<\/em><\/strong>   <em>vLayer<\/em>   Optional object layer selector.<br><\/div><\/div><div class=\"custom-section\"><div id=\"96af8dad-443d-14be-ba41-8bd452e30d78\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tObjects<\/em>   Ordered object records.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getProperties": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Copies typed properties for the map, selected layer or object ID.<\/div><\/div><div class=\"custom-section\"><div id=\"5af3f55d-0054-e8b1-9870-fdf190ed1c69\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|string|nil<\/em><\/strong>   <em>vLayer<\/em>   Optional layer selector; nil selects map.   <strong><em>number|nil<\/em><\/strong>   <em>nObjectID<\/em>   Optional object ID, taking precedence over layer.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b0b0dca4-8d94-66f1-c746-bb2d0e7aafbf\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tProperties<\/em>   Named records with type, propertyType, value and rawValue.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getTile": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Copies resolved terrain and flip/hex rotation flags at a native cell.\n        GID 0 returns an empty tile record; absent finite/chunk cells return nil.<\/div><\/div><div class=\"custom-section\"><div id=\"9179ee58-92cf-8b25-88d6-0989ebffcc5d\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|string<\/em><\/strong>   <em>vLayer<\/em>   Tile layer selector.   <strong><em>number<\/em><\/strong>   <em>nX<\/em>   Native column.   <strong><em>number<\/em><\/strong>   <em>nY<\/em>   Native row.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e5593bec-c122-7c99-7e00-5ac7c711a98d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table|nil<\/em><\/strong>   <em>tTile<\/em>   Resolved tile record.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getTilesets": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Copies tilesets in ascending firstgid order, with sparse local tile IDs,\n        typed properties, resolved image paths, animation frames and raw collision XML.<\/div><\/div><div class=\"custom-section\"><div id=\"a9288b6e-af40-aa5a-9aa8-3d4555723623\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tTilesets<\/em>   Ordered tileset records.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getXML": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns canonical editable TMX. Tile data is CSV and templates are expanded;\n        external TSX references and unknown metadata are retained.<\/div><\/div><div class=\"custom-section\"><div id=\"c943741e-2782-a5b1-79e7-a1bfdf590509\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sXML<\/em>   UTF-8 map XML.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "load": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Loads TMX plus required TSX/templates atomically. The host controls resource\n        reading and decompression; callbacks are used for this operation only.<\/div><\/div><div class=\"custom-section\"><div id=\"0962ca41-eb9b-7325-e8ce-4ffdf8fe7f08\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sPath<\/em>   Map file path.   <strong><em>function|nil<\/em><\/strong>   <em>fRead<\/em>   Reader (path) returning XML; default uses io.open.   <strong><em>function|nil<\/em><\/strong>   <em>fDecompress<\/em>   Decoder (bytes, format, expectedByteCount).<br><\/div><\/div><div class=\"custom-section\"><div id=\"c7b8c3d5-ed75-eabd-24a7-273865cf4f07\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Tiled<\/em><\/strong>   <em>this<\/em>   Map object for chaining.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "parse": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Parses TMX text atomically. sPath identifies its containing file so relative\n        resources resolve correctly; nil uses the current working directory.<\/div><\/div><div class=\"custom-section\"><div id=\"8c170554-aeee-5ab1-a6c3-d8e76662648c\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sSource<\/em>   TMX source text.   <strong><em>string|nil<\/em><\/strong>   <em>sPath<\/em>   Containing map filename, not a directory.   <strong><em>function|nil<\/em><\/strong>   <em>fRead<\/em>   Optional XML resource reader.   <strong><em>function|nil<\/em><\/strong>   <em>fDecompress<\/em>   Optional compressed tile decoder.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bcb4fdf4-56a4-aeb8-3e22-1c622fa3aaf5\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Tiled<\/em><\/strong>   <em>this<\/em>   Map object for chaining.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "pixelToTile": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Finds the cell containing displayed map pixels for any supported orientation.\n        An optional layer selector removes its inherited pixel offset before projection.\n        Coordinates outside finite bounds remain valid grid coordinates.<\/div><\/div><div class=\"custom-section\"><div id=\"e3e75180-8054-ac10-76fe-adaa1d396c85\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nPixelX<\/em>   Displayed horizontal coordinate.   <strong><em>number<\/em><\/strong>   <em>nPixelY<\/em>   Displayed vertical coordinate.   <strong><em>number|string|nil<\/em><\/strong>   <em>vLayer<\/em>   Optional layer offset context.<br><\/div><\/div><div class=\"custom-section\"><div id=\"3e41647f-e542-9985-33f6-23bb209d34b9\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nX<\/em>   Native column.   <strong><em>number<\/em><\/strong>   <em>nY<\/em>   Native row.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "removeLayer": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Removes a layer and its descendants. Remaining layer/object IDs are retained.<\/div><\/div><div class=\"custom-section\"><div id=\"acecc7d2-5394-9206-1bff-5e0aef4d094c\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|string<\/em><\/strong>   <em>vLayer<\/em>   Layer selector.<br><\/div><\/div><div class=\"custom-section\"><div id=\"97e60f8d-b5ca-de0a-2c93-6039aa85fe72\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Tiled<\/em><\/strong>   <em>this<\/em>   Map object for chaining.<br><\/div><\/div><\/div>`,
                    "subtable": null

                "removeObject": {

                "toAStar": {

                "InheritedCoGObject": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Shared CoG object metadata, tags and event dispatch. Concrete subclasses call the protected constructor.\n    Names and descriptions must contain non-whitespace text. Rarity falls back to the first configured level.\n    <ul>\n    <li>getName() and getDescription() expose protected strings; no replacement setters are generated.<\/li>\n    <li>getRarity() exposes rarity; setRarity(eRarity) checks the owned AffixSystem before changing it.<\/li>\n    <li>getAffixSystem() returns the owned component; affix behavior resides in AffixSystem.<\/li>\n    <li>getTagSystem() is final and returns the mutable per-object TagSystem; no replacement setter is generated.<\/li>\n    <li>fireEvent(eEventID, ...) is final and delegates to this object's eventrix.<\/li>\n    <\/ul><\/div><\/div><\/div>`,

                    "value": ``,

                    "CoGVehicle": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Validates vehicle inputs, initializes CoGObject, then stores the\n        vehicle state. Owner and inherited metadata are optional trailing arguments.\n        Only nil selects defaults. Fuel defaults to Pool(); numbers to zero;\n        Tradable to true; other flags to false. Tradable covers selling as well\n        as other trades. Component slots are case-sensitive.<\/div><\/div><div class=\"custom-section\"><div id=\"3dc5c7be-d272-fa2f-bb08-a618ebc99965\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool|nil<\/em><\/strong>   <em>oFuel<\/em>   Fuel Pool or subclass instance, retained by reference.   <strong><em>boolean|nil<\/em><\/strong>   <em>bUnmanned<\/em>   Whether the vehicle is unmanned.   <strong><em>number|nil<\/em><\/strong>   <em>nDistancePerFuelUnit<\/em>   Finite nonnegative fuel efficiency.   <strong><em>table|nil<\/em><\/strong>   <em>tComponents<\/em>   Configured names or enum members mapped to objects.   <strong><em>number|nil<\/em><\/strong>   <em>nValue<\/em>   Finite nonnegative vehicle value.   <strong><em>boolean|nil<\/em><\/strong>   <em>bTradable<\/em>   Whether the vehicle can be traded, including sold.   <strong><em>boolean|nil<\/em><\/strong>   <em>bQuest<\/em>   Whether the vehicle is quest-related.   <strong><em>boolean|nil<\/em><\/strong>   <em>bExclusive<\/em>   Whether the vehicle is exclusive.   <strong><em>boolean|nil<\/em><\/strong>   <em>bInimitable<\/em>   Caller-enforced copying metadata.   <strong><em>number|nil<\/em><\/strong>   <em>nMaxSpeed<\/em>   Finite nonnegative maximum speed.   <strong><em>object|null|nil<\/em><\/strong>   <em>oOwner<\/em>   Optional class instance; nil means null.   <strong><em>string|nil<\/em><\/strong>   <em>sName<\/em>   Nonblank name, defaulting to Vehicle.   <strong><em>string|nil<\/em><\/strong>   <em>sDescription<\/em>   Nonblank description, defaulting to A vehicle.   <strong><em>Rarity.LEVEL|nil<\/em><\/strong>   <em>eRarity<\/em>   Rarity passed to CoGObject.   <strong><em>string|nil<\/em><\/strong>   <em>sEventrixEnvironment<\/em>   Event environment name passed to CoGObject.<br><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Throws<\/div><div class=\"section-content\">   Invalid vehicle inputs or an inherited constructor error.<\/div><\/div><\/div>`,

class Dox {
    constructor() {
        if (Dox.instance) {
            return Dox.instance;
        }
        Dox.instance = this;
        this.data = doxData;
        this.activeFQXN = "Modules";
        this.restoreLocation();
        // Only local fragment links belong to the documentation navigator.
        document.body.addEventListener('click', (event) => {
            const anchor = event.target.closest('a[href]');
            if (!anchor || !anchor.getAttribute('href').startsWith('#')) {
                return;
            }
            const fragment = anchor.getAttribute('href').slice(1);
            if (!fragment) {
                event.preventDefault();
                return;
            }
            const path = this.pathFromFragment(fragment);
            if (this.fqxnIsValid(path)) {
                event.preventDefault();
                this.setActiveFQXN(path);
                this.updatePage();
            }
        });
        // History traversal renders the stored location without adding another entry.
        window.addEventListener('popstate', () => {
            this.restoreLocation();
            this.updatePage(false);
        });
        window.addEventListener('hashchange', () => {
            this.restoreLocation();
            this.updatePage(false);
        });
    }
    byID(id) {
        return document.getElementById(id);
    }
    static copyToClipboard(button) {
        const code = button.closest('.custom-section').querySelector('pre code, pre');
        if (!code) {
            return;
        }
        const textarea = document.createElement('textarea');
        textarea.value = code.textContent;
        document.body.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand('copy');
        textarea.remove();
        button.textContent = copied ? 'Copied' : 'Copy failed';
        window.setTimeout(() => { button.textContent = 'Copy'; }, 1500);
    }
    fqxnIsValid(path) {
        return this.getDataByFQDN(path) !== null;
    }
    getActiveFQXN() {
        return this.activeFQXN;
    }
    getDataByFQDN(path) {
        let current = this.data;
        let node = null;
        for (const part of path.split('.')) {
            if (!current || !Object.prototype.hasOwnProperty.call(current, part)) {
                return null;
            }
            node = current[part];
            current = node.subtable;
        }
        return node;
    }
    makeLink(path, label) {
        const anchor = document.createElement('a');
        anchor.href = '#' + path.replace(/^Modules\.?/, '');
        anchor.textContent = label.split('%20').join(' ');
        anchor.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            this.setActiveFQXN(path);
            this.updatePage();
        });
        return anchor;
    }
    pathFromFragment(fragment) {
        let decoded;
        try {
            decoded = decodeURIComponent(fragment);
        } catch (_) {
            return '';
        }
        return 'Modules.' + decoded.replace(/^Modules\.?/, '').split(' ').join('%20');
    }
    restoreLocation() {
        const path = window.location.hash ? this.pathFromFragment(window.location.hash.slice(1)) : 'Modules';
        this.activeFQXN = this.fqxnIsValid(path) ? path : 'Modules';
    }
    setActiveFQXN(path) {
        if (!this.fqxnIsValid(path)) {
            return false;
        }
        this.activeFQXN = path;
        return true;
    }
    updateBreadcrumb() {
        const breadcrumb = this.byID('DOX_breadcrumb');
        breadcrumb.replaceChildren();
        const parts = this.activeFQXN.split('.');
        parts.forEach((part, index) => {
            const item = document.createElement('li');
            item.className = 'breadcrumb-item';
            const label = index === 0 ? 'Overview' : part;
            if (index === parts.length - 1) {
                item.textContent = label.split('%20').join(' ');
                item.classList.add('active');
                item.setAttribute('aria-current', 'page');
            } else {
                item.appendChild(this.makeLink(parts.slice(0, index + 1).join('.'), label));
            }
            breadcrumb.appendChild(item);
        });
    }
    updateContent() {
        const node = this.getDataByFQDN(this.activeFQXN);
        const content = this.byID('DOX_content');
        content.innerHTML = node.value || '<div class="dox-empty">Choose a topic from the navigation to explore its documentation.</div>';
        this.byID('DOX_topic').textContent = this.activeFQXN === 'Modules' ? 'Documentation overview' : this.activeFQXN.split('.').slice(-1)[0].split('%20').join(' ');
        this.byID('DOX_location').textContent = this.activeFQXN.replace(/^Modules\.?/, '').split('%20').join(' ') || 'Explore the project reference';
    }
    updateNavMenu() {
        const menu = this.byID('DOX_navmenu');
        menu.replaceChildren();
        const active = this.getDataByFQDN(this.activeFQXN);
        const parentPath = this.activeFQXN.split('.').slice(0, -1).join('.');
        const groupPath = active.subtable ? this.activeFQXN : parentPath;
        const group = this.getDataByFQDN(groupPath);
        const upPath = groupPath.split('.').slice(0, -1).join('.');
        this.byID('DOX_navheading').textContent = groupPath === 'Modules' ? 'Project reference' : groupPath.split('.').slice(-1)[0].split('%20').join(' ');
        if (upPath) {
            const item = document.createElement('li');
            const anchor = this.makeLink(upPath, '← Back to parent');
            anchor.className = 'nav-link dox-up';
            item.appendChild(anchor);
            menu.appendChild(item);
        }
        Object.keys(group.subtable || {}).sort().forEach((key) => {
            const path = groupPath + '.' + key;
            const item = document.createElement('li');
            item.className = 'nav-item';
            const anchor = this.makeLink(path, key);
            anchor.className = 'nav-link';
            if (path === this.activeFQXN) {
                anchor.classList.add('active');
                anchor.setAttribute('aria-current', 'page');
            }
            item.appendChild(anchor);
            menu.appendChild(item);
        });
    }
    updatePage(recordHistory = true) {
        this.updateNavMenu();
        this.updateBreadcrumb();
        this.updateContent();
        Prism.highlightAll();
        if (recordHistory) {
            const hash = this.activeFQXN === 'Modules' ? '' : '#' + this.activeFQXN.slice(8);
            if (window.location.hash !== hash) {
                history.pushState({ activeFQXN: this.activeFQXN }, '', window.location.pathname + window.location.search + hash);
            }
        }
    }
}


    function bootDox() {
        const oDox = new Dox();
        oDox.updatePage(false);
    }

    if (window.Prism) {
        bootDox();
    } else {
        window.addEventListener('load', bootDox);
    }
    </script>
</body>
