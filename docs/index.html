                "refreshPreview": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Recalculates cycle boundaries from the current path position and live budgets without moving, paying or replanning the route. Useful after cycling rovers or changing movement settings.<\/div><\/div><div class=\"custom-section\"><div id=\"83924de4-6014-1262-5598-65f26a35496b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarPath<\/em><\/strong>   <em>oPath<\/em>   This path.<br><\/div><\/div><div class=\"custom-section\"><div id=\"07015927-de00-7e94-4e25-d996b3f2ba11\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(100, Pool.ASPECT.MAX);\n    oPoints.setFull();\n    local oPath = AStar.Path(oNode, oMap.getNode(\"ground\", 3, 2), oRover);\n    oPoints.set(0);\n    oPoints.set(10, Pool.ASPECT.CYCLE_FLAT);\n    oPath.refreshPreview();\n    assert(oPath.getCycleCount() == 3);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setOnStepCallback": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets the step callback, or clears it for non-function input. Runs once after a successful committed group step and after rover exit, entry and move callbacks. Receives (path, rovers, currentNodeIndex, totalSteps, currentNode, previousNode); totalSteps excludes the start. Installing a callback does not execute the path.<\/div><\/div><div class=\"custom-section\"><div id=\"5ae27862-66cb-583b-e509-bc68121925b1\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>function|nil<\/em><\/strong>   <em>fFunc<\/em>   The callback.<br><\/div><\/div><div class=\"custom-section\"><div id=\"870a1d17-5e18-1a89-4e0f-a87f7ef0534d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarPath<\/em><\/strong>   <em>oPath<\/em>   This path.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4c1f6cdc-6376-961d-2b7a-9626c80c6855\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(100, Pool.ASPECT.MAX);\n    oPoints.setFull();\n    local oPath = AStar.Path(oNode, oMap.getNode(\"ground\", 3, 2), oRover);\n    local nCalls = 0;\n    oPath.setOnStepCallback(function() nCalls = nCalls + 1; end);\n    assert(oPath.step() and nCalls == 1);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "step": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Advances every member one node along the planned route. Rechecks current positions, traversal permission, destination passability and each budget before changing state. A failed check or completed route returns false with no movement, payment or callbacks. Success moves and charges the entire group, advances the path and refreshes preview before callbacks. Reentrant movement is blocked until notifications finish. Callback errors do not undo success: remaining notifications are attempted and the first error is rethrown.<\/div><\/div><div class=\"custom-section\"><div id=\"b2e7c47e-13c1-5431-146c-d08c11de8527\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bMoved<\/em>   Whether the group advanced one node.<br><\/div><\/div><div class=\"custom-section\"><div id=\"a174a805-54b8-8097-1a36-8417459a93b3\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar();\n    local oMap    = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\")}, 2, 1);\n    local oStart  = oMap.getNode(\"ground\", 1, 1);\n    local oRover  = oStart.createRover();\n    oRover.getMovePointPool().set(10, Pool.ASPECT.MAX);\n    oRover.getMovePointPool().setFull();\n    local oPath = AStar.Path(oStart, oMap.getNode(\"ground\", 2, 1), oRover);\n    assert(oPath.step() and oRover.getMovePointPool().get() == 0);\n    assert(not oPath.step()); --already at the destination<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }

                "subtable": {
                "AStarRover": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates a rover owned by the supplied node, with neutral affinities and aversions for every aspect in its AStar system and zero movement points.<\/div><\/div><div class=\"custom-section\"><div id=\"c96a35c0-d462-b9e6-cd8b-2e135d581548\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oAStarNode<\/em>   The initial owning node.   <strong><em>boolean|nil<\/em><\/strong>   <em>bRetainsPointsOverCycle<\/em>   Whether unused points carry into the next cycle; defaults to true.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c7ba78d0-c14d-9d57-8de4-263b8ef7cee1\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   The new rover.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b9aa1502-bb41-e104-18ed-d3fde3d4349a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    assert(type(oRover) == \"AStarRover\" and oRover.getOwner() == oNode);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "RetainsPointsOverCycle": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Whether unused movement points carry into the next cycle. Defaults to true. Generates retainsPointsOverCycle and setRetainsPointsOverCycle; both methods are final. False clears CURRENT before applying regeneration.<\/div><\/div><div class=\"custom-section\"><div id=\"429df664-6740-843c-43a2-8c2a748d54af\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar();\n    local oMap    = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\")}, 1, 1);\n    local oRover  = oMap.getNode(\"ground\", 1, 1).createRover(false);\n    assert(not oRover.retainsPointsOverCycle());\n    oRover.setRetainsPointsOverCycle(true);\n    assert(oRover.retainsPointsOverCycle());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "abhors": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether this rover abhors the named aspect. Names are matched in uppercase; an unknown aspect returns false.<\/div><\/div><div class=\"custom-section\"><div id=\"adeee6b4-32c6-35a3-44d7-5235d8a3f401\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sAspect<\/em>   A nonblank aspect name.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2d27d5c4-2f2f-3e83-a3ae-6fdb7b9fedb4\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bAbhors<\/em>   Whether this rover abhors the aspect.<br><\/div><\/div><div class=\"custom-section\"><div id=\"17c50739-9780-3c61-9f08-fca23615b04f\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    oRover.setAbhors(\"mud\", true);\n    assert(oRover.abhors(\"MUD\"));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "addDeniedType": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adds a type denied entry to nodes occupied by this rover. An asterisk denies all unlike types. A type already owned by this rover cannot be denied. Names are stored in uppercase.<\/div><\/div><div class=\"custom-section\"><div id=\"a4f73078-6fdc-6c09-c041-cd4ed0fd4dbc\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sType<\/em>   A nonblank type name.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bdd0abc0-01a6-8d63-c6dd-d63fe594d605\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   This rover, for chaining.<br><\/div><\/div><div class=\"custom-section\"><div id=\"3b7211a2-72c7-f25e-c1bd-4d7d2a73827f\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    oRover.addDeniedType(\"enemy\");\n    assert(oRover.hasDeniedType(\"ENEMY\"));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "addType": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adds an uppercase rover type unless it is already present or explicitly denied.<\/div><\/div><div class=\"custom-section\"><div id=\"a54fd86a-c971-bae7-c27d-979adaa15676\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sType<\/em>   A nonblank type name.<br><\/div><\/div><div class=\"custom-section\"><div id=\"a74504c7-7191-b46a-9372-b75c3fb552f6\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   This rover, for chaining.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9c12dc3e-90bf-39aa-324f-5054e59a16fb\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    oRover.addType(\"goblin\");\n    assert(oRover.isType(\"GOBLIN\"));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null

                "allowsEntryTo": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether another rover may enter a node occupied by this rover. A shared type always allows entry; otherwise the wildcard or a matching denied type blocks entry.<\/div><\/div><div class=\"custom-section\"><div id=\"d582f382-b625-6eb9-02d1-914400706fe6\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>other<\/em>   The other rover.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1dca91db-db28-a99f-62f0-22befcc86ec8\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bAllowed<\/em>   Whether the other rover may enter.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ea9d35b7-613f-3558-fcaa-e5a88d437e5d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    local oOther = oNode.createRover();\n    oOther.addType(\"enemy\");\n    oRover.addDeniedType(\"enemy\");\n    assert(not oRover.allowsEntryTo(oOther));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "cycle": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Cycles this rover's movement-point Pool using its configured regeneration and available capacity. When RetainsPointsOverCycle is false, clears unused points before regeneration. Does not move the rover. The caller determines when turns or cycles occur.<\/div><\/div><div class=\"custom-section\"><div id=\"2af19cdc-5e5a-a4a7-717e-c386716f554b\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nMultiplier<\/em>   The regeneration multiplier; defaults to 1, as for Pool.cycle.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d88bb0d0-9dc7-d9f4-59b1-d409d670eec5\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   This rover.<br><\/div><\/div><div class=\"custom-section\"><div id=\"61f8be8b-4c11-baca-b5c5-b4c688f59674\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar();\n    local oMap    = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\")}, 1, 1);\n    local oRover  = oMap.getNode(\"ground\", 1, 1).createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(30, Pool.ASPECT.MAX);\n    oPoints.set(10, Pool.ASPECT.CYCLE_FLAT);\n    oRover.cycle();\n    assert(oPoints.get() == 10);<\/code><\/pre><\/div><\/div><\/div>`,

                "getMovePointPool": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the caller-configurable movement-point Pool, initially zero with capacity 1 and zero regeneration. Configure MAX for capacity and CYCLE_FLAT or CYCLE_PERCENT for regeneration. Movement deducts entry cost from CURRENT without changing capacity or regeneration.<\/div><\/div><div class=\"custom-section\"><div id=\"9f5b169d-fc8a-0b5d-256d-5aed5d552d63\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPoints<\/em>   The movement-point budget.<br><\/div><\/div><div class=\"custom-section\"><div id=\"3ed9aecc-59b1-52d5-5029-fc3980d500e3\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar();\n    local oMap    = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\")}, 2, 1);\n    local oRover  = oMap.getNode(\"ground\", 1, 1).createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(30, Pool.ASPECT.MAX);\n    oPoints.set(10, Pool.ASPECT.CYCLE_FLAT);\n    oPoints.setFull();\n    assert(oPoints.get() == 30);\n    assert(oPoints.get(Pool.ASPECT.CYCLE) == 10);<\/code><\/pre><\/div><\/div><\/div>`,

                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Moves to one destination node in the same AStar system. Ordinary movement requires edge adjacency or an outgoing port permitted by its passage rule; teleportation skips connection and port-rule checks. All moves enforce destination passability and layer permission. Successful moves update occupancy, owner and payment before callbacks. Failed checks change no state and fire no callbacks. No intermediate nodes are visited.<\/div><\/div><div class=\"custom-section\"><div id=\"c008ce43-d5d6-9f49-136e-b3b79b9b6c93\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The destination.   <strong><em>boolean|nil<\/em><\/strong>   <em>bDeferCost<\/em>   True skips payment; defaults to false.   <strong><em>boolean|nil<\/em><\/strong>   <em>bTeleport<\/em>   True bypasses adjacency; defaults to false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ba5fa617-ddf8-6737-fd84-fa50092ac2cc\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bMoved<\/em>   Whether the move succeeded.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bb087346-74c5-0d18-33ca-4cb112bee1b6\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(10, Pool.ASPECT.MAX);\n    oPoints.setFull();\n    assert(oRover.move(oMap.getNode(\"ground\", 2, 1)) and oPoints.get() == 0);<\/code><\/pre><\/div><\/div><\/div>`,

        "CoGRegistry": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   A mutable registry of allowed CoG classes and specific instances.\n    Class entries match through inheritance; instance entries match exact identity.\n    An object must match at least one entry before the prerequisite is called.\n    Empty registries deny all objects. Register CoG to permit every CoG subtype.\n    Methods use dot calls. Prerequisites receive (oObject, ...) and return a\n    boolean, optionally followed by a string reason. Checks should not mutate\n    game state. Callback errors propagate rather than silently denying access.<\/div><\/div><div class=\"custom-section\"><div id=\"2dd07bf3-7844-0a42-05cd-1a38cffd280a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oRegistry = CoGRegistry({CoG}, nil, true);\n    local bAllowed, sReason = oRegistry.allows(oActor, oItem, tContext);<\/code><\/pre><\/div><\/div><\/div>`,
            "subtable": {
            "Methods": {
                "value": ``,

        "Config": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Assembles bundled CoG defaults, then overlays an optional user config.lua.\n    The loader always calls this bundled file. A positive config-parent level locates\n    the user's config.lua above the Cog root directory; zero uses bundled defaults alone.\n    User files return ordinary tables containing only the settings they override.\n    Ordinary overrides apply recursively to existing keys only, including list indices.\n    A user table whose metatable contains __purge = true replaces that branch with its supplied\n    contents, allowing new keys and shorter lists. The marker is not runtime data.\n    StatusTracker is an application-defined hierarchy and replaces its section in full.\n    The final table and its ordinary subtables are read-only at runtime.\n    TIER is a private enum stored in this table, not registered globally. Project\n    overrides load first so the selected tier is available to dependent defaults.\n    The bundled Rarity section receives that selected enum explicitly.<\/div><\/div><\/div>`,
            "subtable": {
            "Rarity": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Builds rarity defaults with the configured tier enum; no global TIER is required.<\/div><\/div><div class=\"custom-section\"><div id=\"d7516d76-c1bf-1cda-525d-00bb13b6f03f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enum<\/em><\/strong>   <em>eTier<\/em>   The tier collection selected by the configuration assembler.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9d9763bb-621f-327c-7158-4b7694f4b083\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>Rarity<\/em>   settings referencing that exact collection.<br><\/div><\/div><\/div>`,
                "subtable": null
            },
            "TIER": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Default tier enum: twenty Roman-numeral members with numeric ordinal values.\n      This private enum is stored in CoG configuration rather than the global\n      environment. A project's config table may replace TIER with its own enum.\n      Access members through CoG.config.TIER.I; id is their one-based ordinal.\n      Member payloads may be numbers, tables or nested enums. Framework tier\n      ordering uses member ids and does not depend on numeric payloads.<\/div><\/div><\/div>`,
                "subtable": null
            }
            }
        },
        "CreatureSystem": {
            "value": ``,
            "subtable": {
            "CoGCreature": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Generic CoGObject subclass owning independent XP, HP, inventory, equipment,\n    status and targeting components. Components are created in the constructor and\n    exposed through final getters without replacement setters. Their own APIs remain\n    mutable. XPSystem owns level calculation; subclasses define gameplay behavior.\n    No species, faction, age, mana, stamina, damage, death or resource-cycling policy\n    is imposed. Required XP/HP values and a configured status category come from the caller.<\/div><\/div><\/div>`,
                "subtable": {
                "InheritedCoGObject": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Shared CoG object metadata, tags and event dispatch. Concrete subclasses call the protected constructor.\n    Names and descriptions must contain non-whitespace text. Rarity falls back to the first configured level.\n    <ul>\n    <li>getName() and getDescription() expose protected strings; no replacement setters are generated.<\/li>\n    <li>getRarity() exposes rarity; setRarity(eRarity) checks the owned AffixSystem before changing it.<\/li>\n    <li>getAffixSystem() returns the owned component; affix behavior resides in AffixSystem.<\/li>\n    <li>getTagSystem() is final and returns the mutable per-object TagSystem; no replacement setter is generated.<\/li>\n    <li>fireEvent(eEventID, ...) is final and delegates to this object's eventrix.<\/li>\n    <\/ul><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "Methods": {
                    "value": ``,
                    "subtable": {
                    "CoGCreature": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Initializes inherited metadata and constructs fresh components using existing system APIs.\n        The options table supplies configuration, never replacement component instances.\n        <ul>\n        <li>XP: table containing Type, LevelOneXP, MaxLevel and Progression, all required by XPSystem. Optional StepSize uses XPSystem's default of 2.<\/li>\n        <li>HP: table containing explicit numeric Max and Current, validated/clamped by Pool.<\/li>\n        <li>StatusScope: actual configured StatusTracker category enum. No default category is invented; subclasses supply their own scope.<\/li>\n        <\/ul>\n        Inventory and equipment use their existing empty defaults and associate this creature as owner.<\/div><\/div><div class=\"custom-section\"><div id=\"744785be-9b97-76c8-daf1-e4d04f368df5\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sName<\/em>   Nonblank name passed to CoGObject.   <strong><em>string<\/em><\/strong>   <em>sDescription<\/em>   Nonblank description passed to CoGObject.   <strong><em>Rarity.LEVEL|nil<\/em><\/strong>   <em>eRarity<\/em>   Rarity passed to CoGObject.   <strong><em>string|nil<\/em><\/strong>   <em>wEventrix<\/em>   Registered event environment name passed to CoGObject.   <strong><em>table<\/em><\/strong>   <em>tOptions<\/em>   Required XP, HP and StatusScope configuration described above.<br><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Throws<\/div><div class=\"section-content\">   Missing/invalid options, a nonconfigured status scope, or an inherited/component constructor error.<\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "__clone": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Requires concrete subclasses to define copying of creature state,\n        component ownership, inherited metadata and runtime callbacks.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Throws<\/div><div class=\"section-content\">   Always unless a subclass supplies its own __clone.<\/div><\/div><\/div>`,

            "Factorium": {

        "Pool": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <h2>Pool<\/h2><h3>Utility class used to keep track of things like Health, Magic, etc.<\/h3><p>You can operate on <strong>Pool<\/strong> objects using some math operators.<\/p>\n    <ul>\n        <li><p><b>+<\/b>: adds a number to the Pool's CURRENT value or, if adding another Pool object instead of a number, it will add the other Pool's CURRENT value to it's own <em>(up to its available capacity)<\/em> value.<\/p><\/li>\n        <li><p><b>-<\/b>: does the same as addition but for subtraction. Will not go below the Pool's MIN value.<\/p><\/li>\n        <li><p><b>%<\/b>: will modify a Pool's MAX value using a number value or another Pool object <em>(uses it's MAX value)<\/em>. Requires a calculated maximum of at least 1 and enough capacity for existing reservations.<\/p><\/li>\n        <li><p><b>*<\/b>: operates as expected on the object's CURRENT value.<\/p><\/li>\n        <li><p><b>/<\/b>: operates as expected on the object's CURRENT value. All div is floored.<\/p><\/li>\n        <li><p><b>-<\/b><em>(unary minus)<\/em>: will set the object's CURRENT value to the value of MIN.<\/p><\/li>\n        <li><p><b>#<\/b>: will set the object's CURRENT value to the available capacity and return that current value.<\/p><\/li>\n    <\/ul><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Note<\/div><div class=\"section-content\">   Arithmetic operators update the left Pool in place and return it. Unary minus empties it; length fills available capacity and returns current. Numbers on the left are not supported.<\/div><\/div><div class=\"custom-section\"><div id=\"d8940141-41de-568d-812a-563ead4d1655\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool.set(10, Pool.ASPECT.CYCLE_FLAT);\n    oPool.cycle();\n    assert(oPool.get() == 50);<\/code><\/pre><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Version<\/div><div class=\"section-content\">   2.1<\/div><\/div><div class=\"custom-section\"><div id=\"9ba9a015-ea48-e90f-c4ed-0830fbecb36b\" class=\"section-title\">Author(s)<\/div><div class=\"section-content\">   Centauri Soldier<br><\/div><\/div><\/div>`,
            "subtable": {
            "Enums": {
                "value": ``,
                "subtable": {
                "ASPECT": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Used in class methods for setting/getting values.\n    <ul>\n        <li><b class=\"text-primary\">AVAILABLE<\/b>\n            <p>Used for getting the total <b>Available<\/b> (<i>Max - Reserved<\/i>).\n            <br>This value is cached and changes only when the Pool's <b>Max<\/b> or <b>Reserved<\/b> values change.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">CURRENT<\/b>\n            <p>Used for getting the <b>Current<\/b> value.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">CYCLE<\/b>\n            <p>Used for getting the <b>Cycle<\/b> amount.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">RESERVED<\/b>\n            <p>Used for getting the total <b>Reserved<\/b> value.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">MAX<\/b>\n            <p>Used for setting/getting <b>Max<\/b> values.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">CYCLE_FLAT<\/b>\n            <p>Used for setting/getting <b>Cycle Flat<\/b> values.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">CYCLE_PERCENT<\/b>\n            <p>Used for setting/getting <b>Cycle Percent<\/b> values.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">RESERVED_FLAT<\/b>\n            <p>Used for setting/getting <b>Reserved Flat<\/b> values.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">RESERVED_PERCENT<\/b>\n            <p>Used for setting/getting <b>Reserved Percent<\/b> values.<\/p>\n        <\/li>\n    <\/ul><\/div><\/div><div class=\"custom-section\"><div id=\"69effe0e-f6eb-8d54-d3a9-6ecd225e8d43\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(200, 80); --create the Pool object with 200 max and 80 current\n    oPool.set(0.36, Pool.ASPECT.RESERVED_PERCENT); --reserve 36% of the Pool\n    print(\"Reserved: \"..oPool.get(Pool.ASPECT.RESERVED)); --> Reserved: 72.0\n    print(\"Available: \"..oPool.get(Pool.ASPECT.AVAILABLE)); --> Available: 128.0\n    oPool.set(0.10, Pool.ASPECT.MAX, Pool.MODIFIER.MULTIPLICATIVE_BONUS); --adjust the max value by 10%\n    print(\"Max: \"..oPool.get(Pool.ASPECT.MAX)); --> Max: 220.0\n    print(\"Reserved: \"..oPool.get(Pool.ASPECT.RESERVED)); --> Reserved: 79.2\n    print(\"Available: \"..oPool.get(Pool.ASPECT.AVAILABLE)); --> Available: 140.8<\/code><\/pre><\/div><\/div><div class=\"custom-section\"><div id=\"046132d0-2ba7-2dd5-c417-8cf2a911b27d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 20);\n    oPool.set(10, Pool.ASPECT.CYCLE_FLAT);\n    oPool.cycle(); --current is now 30<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "EVENT": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <p>Used in class methods for setting/getting events.\n    <br><b>Note<\/b>: events fire only if an event callback function has been set and only if the event is active.\n    <br><b>Note<\/b>: events that trigger because of a change in the <b>Current<\/b> value, proccess before the <b>ON_CYCLE<\/b> event (if active).<\/p>\n    <br><br>\n    <h6>Setting an Event Callback<\/h6>\n    <ol>\n        <li>Create the function, ensuring it accepts the relevant arguments for that specific event (as shown below).<\/li>\n        <li>Set the event by using the object's <b>setEventCallback<\/b> method.<\/li>\n    <\/ol>\n    <br><b>Note<\/b>: event callbacks are auto-enabled once set. To prevent this, provide true as the third argument to <b>setEventCallback<\/b>.\n    <br><b>Note<\/b>: event callbacks can be changed (or deleted using nil as the callback argument).\n    <br><b>Note<\/b>: events can be activated/deactivated by using the <b>setEventActive<\/b> method.\n    <\/p>\n    <ul>\n        <li><b class=\"text-primary\">ON_INCREASE<\/b>\n            <p>This event occurs whenever the current value is increased.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nNew<\/i> The new <b>Current<\/b> value.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ON_DECREASE<\/b>\n            <p>This event occurs whenever the current value is decreased.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nNew<\/i> The new <b>Current<\/b> value.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ON_EMPTY<\/b>\n            <p>This event occurs whenever the current value drops to 0.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Current<\/b> value.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ON_LOW<\/b>\n            <p>This event occurs whenever the current value drops to or below the <b>Low<\/b> threshold.\n            <br>The <b>Low<\/b> threshold is determined by the following formula:\n            <br>Let <b><i>l<\/i><\/b> be a float value between 0 and 1 (exlusive).\n            <br>Let <b><i>m<\/i><\/b> be the max value of the Pool.\n            <b><i>LowThreshold<\/i><\/b> = <b><i>l<\/i><\/b> * <b><i>m<\/i><\/b>\n            <br><br>The <b>Low<\/b> threshold can be set using the object's <b>setLowMarker<\/b> method.\n            <br><b>Note<\/b>: the <b>Low<\/b> value must be less than the <b>High<\/b> value.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nNew<\/i> The new <b>Current<\/b> value.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ON_HIGH<\/b>\n            <p>This event occurs whenever the current value moves to or above the <b>High<\/b> threshold.\n            <br>The <b>High<\/b> threshold is determined by the following formula:\n            <br>Let <b><i>f<\/i><\/b> be a value greater than 0 and no greater than 1.\n            <br>Let <b><i>m<\/i><\/b> be the max value of the Pool.\n            <b><i>HighThreshold<\/i><\/b> = <b><i>f<\/i><\/b> * <b><i>m<\/i><\/b>\n            <br><br>The <b>High<\/b> threshold can be set using the object's <b>setHighMarker<\/b> method.\n            <br><b>Note<\/b>: the <b>High<\/b> value must be greater than the <b>Low<\/b> value.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nNew<\/i> The new <b>Current<\/b> value.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ON_FULL<\/b>\n            <p>This event occurs when current fills the available capacity (maximum minus reserved). A Pool can be full and low at the same time.<\/p>\n            <p>The callback receives the Pool, old current value and new current value.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ON_CYCLE<\/b>\n            <p>This event occurs when the object's <b>cycle<\/b> method changes the current value.\n            <b>Note<\/b>: this event fires after other events that may fire in this call.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nNew<\/i> The new <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nCycle<\/i> The <b>Cycle<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nMultiplier<\/i> The multiplier used to multiply the <b>Cycle<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nTotal<\/i> The total: multiplier times the <b>Cycle<\/b> value.<\/li>\n                    <li><b><i>boolean<\/i><\/b> <i>bIsPositive<\/i> Whether the <b>Cycle<\/b> value was positive.<\/li>\n                    <li><b><i>boolean<\/i><\/b> <i>bCurrentChanged<\/i> Whether the <b>Current<\/b> value actually changed.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ON_RESERVE<\/b>\n            <p>This event occurs whenever the resevered amount increases.\n            <b>Note<\/b>: this can trigger other events such as <b>ON_LOW<\/b>, <b>ON_DECREASE<\/b>, etc.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Reserved<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nNew<\/i> The new <b>Reserved<\/b> value.<\/li>\n                    <li><b><i>boolean<\/i><\/b> <i>bIsPositive<\/i> Whether the <b>Current<\/b> value was changed.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nCurrent<\/i> The <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nAvailable<\/i> The <b>Available<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nMax<\/i> The <b>Max<\/b> value.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n            <li><b class=\"text-primary\">ON_UNRESERVE<\/b>\n            <p>This event occurs whenever the resevered amount decreases.\n            <b>Note<\/b>: this can trigger other events such as <b>ON_FULL<\/b>, <b>ON_INCREASE<\/b>, etc.<\/p>\n            <p>This event callback function must accept the following arguments:\n                <ul>\n                    <li><b><i>Pool<\/i><\/b> <i>oPool<\/i> The Pool object.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nOld<\/i> The old <b>Reserved<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nNew<\/i> The new <b>Reserved<\/b> value.<\/li>\n                    <li><b><i>boolean<\/i><\/b> <i>bIsPositive<\/i> Whether the <b>Current<\/b> value was changed.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nCurrent<\/i> The <b>Current<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nAvailable<\/i> The <b>Available<\/b> value.<\/li>\n                    <li><b><i>number<\/i><\/b> <i>nMax<\/i> The <b>Max<\/b> value.<\/li>\n                <\/ul>\n            <\/p>\n        <\/li>\n    <\/ul><\/div><\/div><div class=\"custom-section\"><div id=\"2ee34c36-d9f7-e1aa-278c-bbbcb02cb8d1\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 100);\n\n    local function adjustLifeUI(this, nPrevious, nCurrent)\n        UI.LifeBar.SetCurrent(nCurrent);\n    end\n    --optionally, disable auto-activation by providing true as the third argument.\n    oPool.setEventCallback(Pool.EVENT.ON_INCREASE, adjustLifeUI);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "MODIFIER": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Used in class methods for getting/setting modifier values of <a href=\"#CoG.Pool.Enums.ASPECT\" target=\"_blank\">ASPECTS<\/a>.\n    <ul>\n        <li><b class=\"text-primary\">BASE<\/b>\n            <p>The unmodified starting value.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">FINAL<\/b>\n            <p>The calculated value; read-only.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">MAX<\/b>\n            <p>An upper cap on the calculated modifier-bearing value.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">BASE_BONUS<\/b>\n            <p>Added to the base before multiplication.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">BASE_PENALTY<\/b>\n            <p>Subtracted from the base before multiplication.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">MULTIPLICATIVE_BONUS<\/b>\n            <p>Added to the multiplier; 0.2 represents a 20% bonus.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">MULTIPLICATIVE_PENALTY<\/b>\n            <p>Subtracted from the multiplier.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ADDITIVE_BONUS<\/b>\n            <p>Added after multiplication.<\/p>\n        <\/li>\n        <li><b class=\"text-primary\">ADDITIVE_PENALTY<\/b>\n            <p>Subtracted after multiplication.<\/p>\n        <\/li>\n    <\/ul><\/div><\/div><div class=\"custom-section\"><div id=\"88520f2d-d102-6a22-0ade-afb2671a857c\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 50);\n    oPool.set(0.2, Pool.ASPECT.MAX, Pool.MODIFIER.MULTIPLICATIVE_BONUS);\n    print(oPool.get(Pool.ASPECT.MAX)); --120<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }

            "Metamethods": {
                "value": ``,
                "subtable": {
                "__add": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adds a number or another Pool's current value to this Pool, clamped to available capacity.<\/div><\/div><div class=\"custom-section\"><div id=\"9d3ec34e-9b03-f516-c432-bfd7db841651\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool|number<\/em><\/strong>   <em>other<\/em>   The right operand.<br><\/div><\/div><div class=\"custom-section\"><div id=\"117d2fb7-e5ad-f1ca-eaca-11f1f3ea02d9\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This Pool.<br><\/div><\/div><div class=\"custom-section\"><div id=\"3f9a1aaa-a1b0-0531-4906-75b94191dadb\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool = oPool + 10;\n    assert(oPool.get() == 50);\n    oPool = oPool + Pool(100, 20);\n    assert(oPool.get() == 70);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "__clone": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates an independent Pool with the same values, thresholds and event activation. Callback function references are retained.<\/div><\/div><div class=\"custom-section\"><div id=\"faf862b8-15aa-9aeb-4e5e-5fc2113f72ae\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oCopy<\/em>   The cloned Pool.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c4e339dd-5499-f853-9c10-5fc59adcf949\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    local oCopy = clone(oPool);\n    oCopy.adjust(10);\n    assert(oCopy.get() == 50 and oPool.get() == 40);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "__div": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Divides current by a number or another Pool's current value and floors the result. Zero divisors are rejected.<\/div><\/div><div class=\"custom-section\"><div id=\"329ba343-bbdf-09bf-8122-2b7c9be45062\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool|number<\/em><\/strong>   <em>other<\/em>   The right operand.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f7d3ea23-5dcf-ec57-85be-f575066de249\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This Pool.<br><\/div><\/div><div class=\"custom-section\"><div id=\"37c52060-afda-ee60-b3f3-20c68cac7733\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 41);\n    oPool = oPool / 2;\n    assert(oPool.get() == 20); --division is floored<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "__len": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Fills available capacity and returns the new current value.<\/div><\/div><div class=\"custom-section\"><div id=\"b0ea1792-cd53-0a4e-1f16-2a89bd95193e\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nCurrent<\/em>   The filled current value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d83a7b0b-eab0-bf3f-e9f4-85660ec192c2\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool.set(20, Pool.ASPECT.RESERVED_FLAT);\n    assert(#oPool == 80); --also fills the Pool\n    assert(oPool.isFull());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "__mod": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets maximum base from a number or another Pool's calculated maximum, using normal capacity validation.<\/div><\/div><div class=\"custom-section\"><div id=\"1d02a8f1-2b13-0982-28ab-53f536b5bcb6\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool|number<\/em><\/strong>   <em>other<\/em>   The right operand.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b0c40db6-cefb-e168-c0a0-a59704d0e4f5\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This Pool.<br><\/div><\/div><div class=\"custom-section\"><div id=\"cd8183e3-6fb3-a8a9-52a1-a89647fb7ecb\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool = oPool % 200; --sets maximum base, rather than calculating a remainder\n    assert(oPool.get(Pool.ASPECT.MAX) == 200);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "__mul": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Multiplies current by a number or another Pool's current value, applying current bounds.<\/div><\/div><div class=\"custom-section\"><div id=\"83c735be-4ad7-5b9c-a0ff-fca4de281f35\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool|number<\/em><\/strong>   <em>other<\/em>   The right operand.<br><\/div><\/div><div class=\"custom-section\"><div id=\"aee760e6-f070-3525-cb51-374d9c940d41\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This Pool.<br><\/div><\/div><div class=\"custom-section\"><div id=\"06ec9094-c978-5782-cca6-d01b69a870cc\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool = oPool * 2;\n    assert(oPool.get() == 80);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "__sub": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Subtracts a number or another Pool's current value from this Pool, clamped at zero.<\/div><\/div><div class=\"custom-section\"><div id=\"535204c3-d88f-d081-b37b-38975d2981cd\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool|number<\/em><\/strong>   <em>other<\/em>   The right operand.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ae3fe5a4-f585-af4f-6780-e72ef0b87343\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This Pool.<br><\/div><\/div><div class=\"custom-section\"><div id=\"53b1b93d-d721-7a63-4fed-886ca9b55e22\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool = oPool - 10;\n    assert(oPool.get() == 30);<\/code><\/pre><\/div><\/div><\/div>`,

            "Methods": {
                "value": ``,
                "subtable": {
                "Pool": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   The constructor for the <b>Pool<\/b> class.<\/div><\/div><div class=\"custom-section\"><div id=\"8f5d2c40-9ead-16f0-e766-475675d20906\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nMax<\/em>   The maximum value of the Pool (minimum 1).   <strong><em>number|nil<\/em><\/strong>   <em>nCurrent<\/em>   The current value of the Pool (minimum 0, maximum nMax).<br><\/div><\/div><div class=\"custom-section\"><div id=\"3ad3715a-e9f1-5525-dd5a-00392f3c66ed\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40); --maximum, current\n    assert(oPool.get(Pool.ASPECT.MAX) == 100 and oPool.get() == 40);<\/code><\/pre><\/div><\/div><\/div>`,
