                },
                "adjust": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adjusts the selected value by an amount. Defaults to CURRENT; modifier-bearing aspects default to their BASE value. Uses the same bounds and events as set.<\/div><\/div><div class=\"custom-section\"><div id=\"7ffb90f2-3310-3639-44d3-e0c6dbd53f35\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nAmount<\/em>   The amount to add or subtract.   <strong><em>Pool.ASPECT|nil<\/em><\/strong>   <em>eAspect<\/em>   The aspect to adjust.   <strong><em>Pool.MODIFIER|nil<\/em><\/strong>   <em>eModifier<\/em>   The modifier to adjust.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d2336d31-8e78-08c7-a77f-099c747aac7e\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This pool.   <strong><em>boolean<\/em><\/strong>   <em>bSuccess<\/em>   Whether the adjustment was accepted or changed CURRENT.   <strong><em>number<\/em><\/strong>   <em>nOverage<\/em>   The rejected capacity or reservation overage; zero for CURRENT changes.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7568f310-bdaa-2d24-9510-52b95e624333\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    local oResult, bSuccess, nOverage = oPool.adjust(-10);\n    assert(oResult == oPool and bSuccess and nOverage == 0);\n    assert(oPool.get() == 30);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "cycle": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Causes the Pool to cycle based on the cycle value (after all modifiers have been applied).\n    <br>This is used for things like regeneration of mana, regen and/or poisoning of life, consumption of fuel, etc.<\/div><\/div><div class=\"custom-section\"><div id=\"c4ef0549-2a90-1d73-a965-47f259ac295c\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nMultiplier<\/em>   If a number is provided, it will cycle the number of times input, otherwise, once.\n    <br>Note: regardless of the multiple provided (if any), the <strong>onCycle<\/strong> event will fire only once per cycle.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9fdfff4c-00a2-a738-a32d-83bb508d5cfc\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   The Pool object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f05f531e-886e-90ec-eea3-ff05594959b2\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool.set(10, Pool.ASPECT.CYCLE_FLAT);\n    oPool.cycle(2); --two regeneration amounts in one call\n    assert(oPool.get() == 60);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "get": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a Pool aspect or one of its modifiers.<\/div><\/div><div class=\"custom-section\"><div id=\"01930ba1-7fa3-f3e3-063b-580e44ed0a28\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool.ASPECT|nil<\/em><\/strong>   <em>eAspect<\/em>   If provided, this refers to the aspect of the pool to get such as MAX or CYCLE.\n    <br>If not provided it will default to CURRENT.   <strong><em>Pool.MODIFIER|nil<\/em><\/strong>   <em>eModifier<\/em>   If provided, this indicates which modifier to get such as BASE, BASE_BONUS, etc.\n    <br>If not provided, it will default to FINAL.\n    <br><strong>Note<\/strong>: not all aspects have all modifiers. E.g., Pool.ASPECT.RESERVED, Pool.ASPECT.CURRENT Pool.ASPECT.AVAILABLE have no modifiers whatsoever and only accessor methods.<br><\/div><\/div><div class=\"custom-section\"><div id=\"0377c21a-eeb3-bdc7-2c23-e02e9c4f5912\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nRet<\/em>   The value requested in either a flat value or a percentage between 0 and 1.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5053fdfd-741d-647c-aa56-fcd0ac30e009\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    assert(oPool.get() == 40);\n    assert(oPool.get(Pool.ASPECT.MAX, Pool.MODIFIER.BASE) == 100);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getHighMarker": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the high-status fraction of total maximum.<\/div><\/div><div class=\"custom-section\"><div id=\"52ee89b7-41f5-b0cc-cdd1-751d30e3dc40\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nMarker<\/em>   The configured value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"0a3e2ab5-0922-de23-47b4-fda7eba54eab\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool.setHighMarker(0.8);\n    assert(oPool.getHighMarker() == 0.8);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getLowMarker": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the low-status fraction of total maximum.<\/div><\/div><div class=\"custom-section\"><div id=\"6db5b8da-5a0f-0d26-f05b-48c7e0c5c941\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nMarker<\/em>   The configured value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"04b39f3b-9d35-56c4-d924-ea4bd90b43ba\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool.setLowMarker(0.2);\n    assert(oPool.getLowMarker() == 0.2);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isEmpty": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Determines whether the Pool is empty.\n    <br>This is true when the current value is less than or equal to 0.<\/div><\/div><div class=\"custom-section\"><div id=\"e5c316aa-cbf5-5431-27c1-898b5fa8a937\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bEmpty<\/em>   True if the Pool is empty, false otherwise.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2e1c7df7-7b8b-d099-9252-bc53bda0ba3a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 0);\n    assert(oPool.isEmpty());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isFull": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Determines whether the Pool is full.\n    <br>This is true when current fills available capacity (maximum minus reserved), independently of low/high status.<\/div><\/div><div class=\"custom-section\"><div id=\"2a5ae4a5-eb8d-3dd6-2732-cf8c39317158\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bFull<\/em>   True if the Pool is full, false otherwise.<br><\/div><\/div><div class=\"custom-section\"><div id=\"70e04d32-f75a-72c8-1de6-f1c78c7ca143\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 80);\n    oPool.set(20, Pool.ASPECT.RESERVED_FLAT);\n    assert(oPool.isFull()); --80 fills the available capacity<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isHigh": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Determines whether current reaches the configurable high marker times total maximum. Reservations do not count toward this threshold.<\/div><\/div><div class=\"custom-section\"><div id=\"8280e56d-3e37-95de-2c23-81c1800e5b5b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bHigh<\/em>   Whether the Pool is high.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4749943b-c58c-dca4-7148-03b8020276ee\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 80);\n    oPool.setHighMarker(0.8);\n    assert(oPool.isHigh());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isLow": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Determines whether the Pool is low.\n    <br>This is true when a nonempty Pool has a status value at or below maximum times the low marker.<\/div><\/div><div class=\"custom-section\"><div id=\"e1321a53-2d9e-f7bf-5af3-361942fd863d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bLow<\/em>   True if the Pool is low, false otherwise.<br><\/div><\/div><div class=\"custom-section\"><div id=\"853d7c02-2c06-3d2e-3767-e3c7d79a3140\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 20);\n    assert(oPool.isLow()); --default low marker is 30% of total maximum<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "set": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets a writable aspect or modifier. CURRENT is clamped to available capacity; invalid capacity or reservation changes are rejected without changing the prior settings.<\/div><\/div><div class=\"custom-section\"><div id=\"5fd21240-bc73-6047-c4e8-51e4de34ab49\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nValue<\/em>   The value to which the item should be set.   <strong><em>Pool.ASPECT|nil<\/em><\/strong>   <em>eAspect<\/em>   If provided, this refers to the aspect of the pool to set such as MAX or CYCLE.\n    <br>If not provided it will default to <b>CURRENT<\/b>.   <strong><em>Pool.MODIFIER|nil<\/em><\/strong>   <em>eModifier<\/em>   If provided, this indicates which modifier to set such as BASE, BASE_BONUS, etc.\n    <br>If not provided, it will default to BASE.\n    <br><strong>Note<\/strong>: not all aspects have all modifiers. E.g., Pool.ASPECT.CURRENT has no modifiers whatsoever.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b273e44c-f579-b6e2-f693-6db700fc8548\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This pool.   <strong><em>boolean<\/em><\/strong>   <em>bSuccess<\/em>   Whether the setting was accepted or changed CURRENT.   <strong><em>number<\/em><\/strong>   <em>nOverage<\/em>   The rejected capacity or reservation overage; zero for CURRENT changes.<br><\/div><\/div><div class=\"custom-section\"><div id=\"dde8598c-c7d6-2323-cbeb-0242b0c3326e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    local oResult, bSuccess, nOverage = oPool.set(120);\n    assert(oResult == oPool and bSuccess and nOverage == 0);\n    assert(oPool.get() == 100);\n    oPool.set(10, Pool.ASPECT.CYCLE_FLAT); --BASE is the default modifier<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setEmpty": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Set the Pool to empty (if not already empty).<\/div><\/div><div class=\"custom-section\"><div id=\"2ef4bf1f-f33c-eec4-f7a0-08b57d1d5a15\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   The Pool object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5cd4ba02-5818-6e2a-c9c0-70bcabc84d79\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool.setEmpty();\n    assert(oPool.isEmpty());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setEventActive": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Enables\\disables an event from triggering.\n    <br>Note: this does not affect any current callback function for this event, it simply makes<br>\n    the event dormant until manually reactivated.<\/div><\/div><div class=\"custom-section\"><div id=\"96373273-f717-0b8b-c489-e8234c1474e8\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool.EVENT<\/em><\/strong>   <em>eEvent<\/em>   The event to enable or disable.   <strong><em>boolean<\/em><\/strong>   <em>bFlag<\/em>   Enables the event if true, disables it otherwise.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8b0023d7-b62d-b051-ce8c-8a5b215d0d06\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   The Pool object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"51d43889-76fb-172f-9e4d-dfac500139af\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    local nCalls = 0;\n    oPool.setEventCallback(Pool.EVENT.ON_INCREASE, function() nCalls = nCalls + 1; end);\n    oPool.setEventActive(Pool.EVENT.ON_INCREASE, false);\n    oPool.adjust(10);\n    assert(nCalls == 0);\n    oPool.setEventActive(Pool.EVENT.ON_INCREASE, true);\n    oPool.adjust(10);\n    assert(nCalls == 1);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setEventCallback": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets a callback function for the specified event. The function will fire whenever the event is triggered.<\/div><\/div><div class=\"custom-section\"><div id=\"f1bc475b-846d-380a-06d0-f835a1594ef9\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Pool.EVENT<\/em><\/strong>   <em>eEvent<\/em>   The event for which the function should be called.   <strong><em>function|nil<\/em><\/strong>   <em>fCallback<\/em>   The callback function.\n    <br>Note: If a function is not input, it will delete any previous callback function and disable the event trigger.   <strong><em>boolean|nil<\/em><\/strong>   <em>bDoNotAutoActivate<\/em>   If a true value is input, it will prevent the event from being activated by this call.\n    <br>If nothing is provided, the event is active by default and the callback function will fire on event trigger.<br><\/div><\/div><div class=\"custom-section\"><div id=\"31a036d0-8982-c9af-2499-e3df4185330b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   The Pool object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ea424d61-999c-9f55-d026-512f299df5ee\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    local nCalls = 0;\n    oPool.setEventCallback(Pool.EVENT.ON_INCREASE, function() nCalls = nCalls + 1; end);\n    oPool.adjust(10);\n    assert(nCalls == 1);\n    oPool.setEventCallback(Pool.EVENT.ON_INCREASE, nil); --clears and disables the callback<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setFull": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets Pool's current value to the maximum available (if not already that high).\n    <br>Note: this is not the same as the maximum value.\n    <br>For instance, if 20% of a Pool (whose max is 100) is reserved, the value would be set to 80.<\/div><\/div><div class=\"custom-section\"><div id=\"e513a67e-e17d-0469-ed54-ca7e7d6db83b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   The Pool object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e4fdfdd3-ff45-2cea-715f-748ffa5a2e7d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 40);\n    oPool.set(20, Pool.ASPECT.RESERVED_FLAT);\n    oPool.setFull();\n    assert(oPool.get() == 80);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setHighMarker": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets the high threshold as a fraction of total maximum. Must be greater than the low marker and no greater than 1. Recalculates status immediately.<\/div><\/div><div class=\"custom-section\"><div id=\"99c3c4ad-252b-70fa-4786-bae5a9c24090\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nValue<\/em>   The high marker.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5328582f-eb1f-e10f-525a-cdd6e6338cc9\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This pool.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2f183a17-7d8e-f5c4-09a7-41b8bc0a0b24\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 80);\n    oPool.setHighMarker(0.8);\n    assert(oPool.isHigh());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setLowMarker": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets the low threshold as a fraction of total maximum. Must be greater than 0 and less than the high marker. Recalculates status immediately.<\/div><\/div><div class=\"custom-section\"><div id=\"e5d0e98e-c0c6-8902-88a5-0b17bb1ddea1\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nValue<\/em>   The low marker.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8c7b96e8-94fc-c0d8-8272-5f2b5b7c9568\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>Pool<\/em><\/strong>   <em>oPool<\/em>   This pool.<br><\/div><\/div><div class=\"custom-section\"><div id=\"fc0d2d8e-fac8-d494-0d27-a4096a015046\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oPool = Pool(100, 20);\n    oPool.setLowMarker(0.2);\n    assert(oPool.isLow());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            },
            "Static%20Methods": {
                "value": ``,
                "subtable": {
                "withDeferredEvents": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Runs a synchronous action, deferring Pool callbacks until it finishes. Values and status update immediately; callbacks then run in order and all queued callbacks are attempted. Nested calls share the outer queue. This is not a rollback transaction: action or callback errors leave committed values intact and the first error is rethrown after notifications. The action must not yield.<\/div><\/div><div class=\"custom-section\"><div id=\"f3606d5a-7aa3-6a57-7cb3-3aefb0c12af9\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>function<\/em><\/strong>   <em>fAction<\/em>   The action to run.<br><\/div><\/div><div class=\"custom-section\"><div id=\"428ebd7c-fc5f-4e9d-5051-2a7c8ed92a9d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>...<\/em>   The action's return values.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2af44b71-9772-0649-e02f-6a1152d27bb1\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oFirst = Pool(100, 40);\n    local oSecond = Pool(100, 40);\n    oFirst.setEventCallback(Pool.EVENT.ON_DECREASE, function()\n        assert(oFirst.get() == 30 and oSecond.get() == 30);\n    end);\n    Pool.withDeferredEvents(function()\n        oFirst.adjust(-10);\n        oSecond.adjust(-10);\n    end);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            }
            }
        },
        "RNG": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   A static helper class for rolling dice, drawing cards, etc. Uses the shared math.random stream; callers control seeding with math.randomseed. Defaults apply only to omitted/nil arguments. Invalid supplied inputs raise errors. All numeric inputs must be finite; die sides and counts must be integers.<\/div><\/div><\/div>`,
            "subtable": {
            "Methods": {
                "value": ``,
                "subtable": {
                "binary": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Generates a random value of 0 or 1.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"bbb4bbd3-7632-95eb-da6d-c8b8a28c7a83\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>vWeight<\/em>   An optional float value that indicates whether to favor the lower or higher result. A higher weight favors 1s while a lower weight value favors 0s. E.g., a weight value of 0.2 will produce a <b>0<\/b> 80% of the time and a <b>1<\/b> 20% of the time, while a value of 0.75 will produce a <b>1<\/b> 75% of the time and a <b>0<\/b> 25% of the time.\n    <br>A nil value will force the default weight of 0.5. Supplied weights must be finite numbers in [0, 1]; 0 always selects the lower/first result, and 1 always selects the higher/second result.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5a758f4b-34e1-e4ce-c473-6573cc633838\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nResult<\/em>   Randomly, 0 or 1.<br><\/div><\/div><div class=\"custom-section\"><div id=\"36e2cd34-d215-16ee-bdfa-cbd4cffc6926\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    print(tostring(RNG.binary())) --randomly, 0 or 1<\/code><\/pre><\/div><\/div><div class=\"custom-section\"><div id=\"737d6f31-c01e-8a90-1d5a-ee0a51f3a98a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nZeros = 0;\n    local nOnes = 0;\n    local nWeight = 0.33;\n    local nTrials = 100000;\n\n    for x = 1, nTrials do\n      local nRes = RNG.binary(nWeight);\n\n      if nRes == 0 then\n        nZeros = nZeros + 1;\n      elseif nRes == 1 then\n        nOnes = nOnes + 1;\n      end\n\n    end\n\n    print(\"Using a weight value of \"..nWeight..\" for \"..nTrials..\" trials.\",\n          \"\\r\\nZeroes Rate: \"..nZeros / nTrials,\n          \"\\r\\nOnes Rate: \"..nOnes / nTrials);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "bipolar": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Generates a random value of -1 or 1.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"929f4fa1-ed40-a175-fef4-c9e38b66a379\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>vWeight<\/em>   An optional float value that indicates whether to favor the lower or higher result. A higher weight favors 1s while a lower weight value favors -1s. E.g., a weight value of 0.2 will produce a <b>-1<\/b> 80% of the time and a <b>1<\/b> 20% of the time, while a value of 0.75 will produce a <b>1<\/b> 75% of the time and a <b>-1<\/b> 25% of the time.\n    <br>A nil value will force the default weight of 0.5. Supplied weights must be finite numbers in [0, 1]; 0 always selects the lower/first result, and 1 always selects the higher/second result.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d858635d-b02f-03da-b46d-422420ad1414\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nResult<\/em>   Randomly, -1 or 1.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2fd88c85-ca8c-d067-01ab-32ad86092cc9\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    print(tostring(RNG.bipolar())) --randomly, -1 or 1<\/code><\/pre><\/div><\/div><div class=\"custom-section\"><div id=\"64d36e1e-e1f9-590b-4599-c458481455d9\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nLows = 0;\n    local nHighs = 0;\n    local nWeight = 0.75;\n    local nTrials = 100000;\n\n    for x = 1, nTrials do\n      local nRes = RNG.bipolar(nWeight);\n\n      if nRes == -1 then\n        nLows = nLows + 1;\n      elseif nRes == 1 then\n        nHighs = nHighs + 1;\n      end\n\n    end\n\n    print(\"Using a weight value of \"..nWeight..\" for \"..nTrials..\" trials.\",\n          \"\\r\\n-1s Rate: \"..nLows / nTrials,\n          \"\\r\\n1s Rate: \"..nHighs / nTrials);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "boolean": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Generates a random boolean value.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"7a0790eb-7d46-2d72-4921-54afbd9ef07f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>vWeight<\/em>   An optional float value that indicates whether to favor the lower or higher result. A higher weight favors trues while a lower weight value favors falses. E.g., a weight value of 0.2 will produce a <b>false<\/b> 80% of the time and a <b>true<\/b> 20% of the time, while a value of 0.75 will produce a <b>true<\/b> 75% of the time and a <b>false<\/b> 25% of the time.\n    <br>A nil value will force the default weight of 0.5. Supplied weights must be finite numbers in [0, 1]; 0 always selects the lower/first result, and 1 always selects the higher/second result.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b01640e3-93d4-9269-f59d-65d599087787\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bFlag<\/em>   Randomly, true or false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d236fd63-769b-ec77-af64-3e600dc7c9ad\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    print(tostring(RNG.boolean())) --randomly, true or false<\/code><\/pre><\/div><\/div><div class=\"custom-section\"><div id=\"f8691d5e-9c66-5a44-b873-71b8529fe139\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local nLows = 0;\n    local nHighs = 0;\n    local nWeight = 0.10;\n    local nTrials = 100000;\n\n    for x = 1, nTrials do\n      local bRes = RNG.boolean(nWeight);\n\n      if bRes == false then\n        nLows = nLows + 1;\n      elseif bRes == true then\n        nHighs = nHighs + 1;\n      end\n\n    end\n\n    print(\"Using a weight value of \"..nWeight..\" for \"..nTrials..\" trials.\",\n          \"\\r\\nFalse Rate: \"..nLows / nTrials,\n          \"\\r\\nTrue Rate: \"..nHighs / nTrials);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "choice": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Chooses between two input values.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"96aed8db-0c47-4ad3-866b-abb81fd9dffc\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>Any<\/em><\/strong>   <em>vItem1<\/em>   Any non-nil value;   <strong><em>Any<\/em><\/strong>   <em>vItem2<\/em>   Any non-nil value;   <strong><em>number|nil<\/em><\/strong>   <em>vWeight<\/em>   An optional float value that indicates whether to favor the <b>first<\/b> or <b>second<\/b> input value. A higher weight favors the <b>second<\/b> while a lower weight value favors the <b>first<\/b>. E.g., a weight value of 0.2 will choose the <b>first<\/b> input value 80% of the time and the <b>second<\/b> input value 20% of the time, while a value of 0.75 will choose the <b>second<\/b> input value 75% of the time and the <b>first<\/b> input value 25% of the time.\n    <br>A nil value will force the default weight of 0.5. Supplied weights must be finite numbers in [0, 1]; 0 always selects the lower/first result, and 1 always selects the higher/second result.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f80258bd-ee6c-90d5-5264-7f6e24a88666\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vRet<\/em>   Either the <b>first<\/b> or <b>second<\/b> input value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"552530ae-157a-5e6a-2042-1ec76b711219\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    print(tostring(RNG.choice(\"Bunny\", \"Cat\"))) --Randomly, \"Bunny\" or \"Cat\"<\/code><\/pre><\/div><\/div><div class=\"custom-section\"><div id=\"6fd04c06-17bb-04ea-7d4d-48d6e6bf5fd5\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local vItem1 = \"Bunny\";\n    local vItem2 = 31;\n\n    local nLows = 0;\n    local nHighs = 0;\n    local nWeight = 0.66;\n    local nTrials = 100000;\n\n    for x = 1, nTrials do\n      local vRes = RNG.choice(vItem1, vItem2, nWeight);\n\n      if vRes == vItem1 then\n        nLows = nLows + 1;\n      elseif vRes == vItem2 then\n        nHighs = nHighs + 1;\n      end\n\n    end\n\n    print(\"Using a weight value of \"..nWeight..\" for \"..nTrials..\" trials.\",\n          \"\\r\\nItem1 Rate: \"..nLows / nTrials,\n          \"\\r\\nItem2 Rate: \"..nHighs / nTrials);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "multiChoice": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Accepts a variable number of arguments and randomly selects one of them. It is an unweighted selection, meaning each argument has an equal chance of being chosen.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"6b34c3d3-9d94-e051-6bb2-05c6b7a0760c\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>...<\/em>   At least one item to choose from; nil arguments are rejected. These can be of any non-nil type (numbers, strings, tables, etc.).<br><\/div><\/div><div class=\"custom-section\"><div id=\"3dc72474-f09d-f279-8643-a55215a1319c\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vItem<\/em>   One of the provided arguments, randomly selected.<br><\/div><\/div><div class=\"custom-section\"><div id=\"a86c2e66-713b-8118-fbf8-0f9d4a2d50fe\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    -- Example 1: Randomly select a fruit from a list\n    local sSelectedFruit = RNG.multiChoice(\"apple\", \"banana\", \"cherry\");\n    print(\"Selected fruit: \" .. sSelectedFruit)\n\n    -- Example 2: Randomly select a number from a list\n    local nSelectedNumber = RNG.multiChoice(10, 20, 30, 40, 50);\n    print(\"Selected number: \" .. nSelectedNumber)\n\n    -- Example 3: Randomly select a color from a list\n    local sSelectedColor = RNG.multiChoice(\"red\", \"green\", \"blue\", \"yellow\");\n    print(\"Selected color: \" .. sSelectedColor)\n\n    -- Example 4: Randomly select from mixed types (string, number, boolean)\n    local vSelectedItem = RNG.multiChoice(\"apple\", 42, true, \"banana\", 3.14, false);\n    print(\"Selected item: \" .. tostring(vSelectedItem))<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "percent": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Generates a percentage value.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"bd2f113e-3020-7fb0-2519-59aca138f8a7\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>boolean|nil<\/em><\/strong>   <em>bFloat<\/em>   Must be boolean when supplied. Whether the result should be a float from 0.01-1 or an int from 1-100 (defaults to false).<br><\/div><\/div><div class=\"custom-section\"><div id=\"feb5f966-1788-2038-165e-5a19603a8121\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nPercent<\/em>   An int or float value from 1-100 or 0.01-1 respectively (inclusive).<br><\/div><\/div><div class=\"custom-section\"><div id=\"c3ff8e44-12f8-6302-c2d6-5e2740f199a0\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    print(tostring(RNG.percent(true)))  --generates a random float from 0.01-1 (inclusive).\n    print(tostring(RNG.percent()))      --generates a random int from 1-100 (inclusive).<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "pick": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Selects and returns a single random element from a numerically indexed table. Supports sparse tables and both 0-based and 1-based numeric indexing.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"917877de-4d53-a6d0-ca7e-e919e08bf0e4\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tInput<\/em>   A table containing numeric indices to choose from.   <strong><em>number|nil<\/em><\/strong>   <em>nPicks<\/em>   Optional nonnegative integer count. When supplied, returns a list of picks; zero returns an empty list.   <strong><em>boolean|nil<\/em><\/strong>   <em>bAllowRepeats<\/em>   Allows the same source entry more than once when true; defaults to false. Distinct entries may hold equal values.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4375216e-aaef-f0bf-3845-9a46e8448cb8\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>any<\/em><\/strong>   <em>vItem<\/em>   One randomly selected item from the table, or nil if no numeric entries exist in single-pick mode. With nPicks, returns a list; impossible counts raise an error. The source is unchanged.<br><\/div><\/div><div class=\"custom-section\"><div id=\"8bb1d8a0-e92e-d2b0-41ca-ee01b525dede\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">        local vPick = RNG.pick({[0] = \"A\", [8] = \"B\"});\n        local tPicks = RNG.pick({\"A\", \"B\", \"C\"}, 2, false);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "randomx": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns an integer in [1, N] with exponential bias.\n        <br>N must be an integer in [1,10]. Each step upward has nWeight times the probability of the preceding step (half as likely at the default weight 0.5).\n        <br><br>\n        -- Weight reference (approximate behavior)\n        -- 1.00 → uniform (no bias)\n        -- 0.80 → gentle bias (most values possible)\n        -- 0.65 → noticeable bias\n        -- 0.50 → strong bias (small values common)\n        -- 0.30 → very strong bias\n        -- 0.10 → extreme bias (almost always 1)<\/div><\/div><div class=\"custom-section\"><div id=\"2269d3ed-9323-cb01-b9f4-0b4765644885\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nMax<\/em>   Requested integer maximum from 1 through 10; defaults to 1.   <strong><em>number|nil<\/em><\/strong>   <em>vWeight<\/em>   A finite value between 0.01 and 1 (inclusive) that sets the ratio from one number to the next; defaults to 0.5. Invalid inputs are rejected rather than clamped.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4d9a2486-e3a6-a3ea-6558-8ba7303f5090\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nResult<\/em>   Biased random integer.<br><\/div><\/div><div class=\"custom-section\"><div id=\"94b2af5d-02dd-e5e1-7fb5-e68053de3352\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local function TestRandomX(nMax, nRuns, nWeight)\n            local tCount = {};\n\n            for i = 1, nMax do\n                tCount[i] = 0;\n            end\n\n            for i = 1, nRuns do\n                local nV = RNG.randomx(nMax, nWeight);\n                tCount[nV] = tCount[nV] + 1;\n            end\n\n            print((\"RNG.randomx(%d), weight = %.2f, runs = %d\")\n                :format(nMax, nWeight, nRuns));\n            print(\"--------------------------------\");\n\n            for i = 1, nMax do\n                local nPct = (tCount[i] / nRuns) * 100;\n                print((\"%2d : %6.2f%%\"):format(i, nPct));\n            end\n\n            print(\"\");\n        end\n\n        TestRandomX(10, 100000, 0.5);\n        TestRandomX(10, 100000, 0.8);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "rollCheck": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Determines whether a check is made based on the input. Often used for things like stat checks. The check will be successful if the number rolled by the function is equal to or higher than the <strong><em>nCheck<\/em><\/strong> parameter.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"016767a7-6f2b-89cd-e441-582290d6f392\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nSides<\/em>   Positive integer die sides; defaults to 20.   <strong><em>number|nil<\/em><\/strong>   <em>nCheck<\/em>   Finite integer success threshold; defaults to 10. Values below 1 always succeed, and values above nSides always fail.<br><\/div><\/div><div class=\"custom-section\"><div id=\"56115388-066f-7c5c-f17b-047c650bc5ec\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bSuccess<\/em>   True if the check was successful or false otherwise.   <strong><em>number<\/em><\/strong>   <em>nRoll<\/em>   The die result.   <strong><em>number<\/em><\/strong>   <em>nMargin<\/em>   The roll minus the threshold.<br><\/div><\/div><div class=\"custom-section\"><div id=\"17798b6e-cdee-f195-9bb8-860f78281bb3\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local bSuccess, nRoll, nMargin = RNG.rollCheck(20, 12);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "rollDice": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Rolls a number of dice, returning the sum total of the roll.\n    <br>The number of sides on the dice is determined by the <strong><em>nSides<\/em><\/strong> parameter (defaults to 6).\n    <br>The number of dice to roll is determined by the <strong><em>nDice<\/em><\/strong> parameter (defaults to 1).\n    <br>The number of attempts is determined by the <strong><em>nAttempts<\/em><\/strong> parameter (defaults to 1).\n    <br> If the number of attempts is set to a value greater than 1, the roll will happen that many times, keeping only the highest total out of all the attempts.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Static Public<\/div><\/div><div class=\"custom-section\"><div id=\"a72baccc-c91a-027d-cc88-697d2b974924\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nSides<\/em>   Positive integer die sides; defaults to 6.   <strong><em>number|nil<\/em><\/strong>   <em>nDice<\/em>   Positive integer number of dice; defaults to 1.   <strong><em>number|nil<\/em><\/strong>   <em>nAttempts<\/em>   Positive integer number of complete rolls; defaults to 1.<br><\/div><\/div><div class=\"custom-section\"><div id=\"0258d0ca-09ce-2dce-d5d5-c9dc1ca3ffed\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nTotal<\/em>   The highest sum from the complete attempts.<br><\/div><\/div><div class=\"custom-section\"><div id=\"6ba1ec32-8086-5b79-e766-f4fea983431a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local nTotal = RNG.rollDice(6, 3, 2); -- Best of two complete 3d6 rolls.<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "rollPercentage": {

<\/pre><\/div><\/div><\/div>`,

        "Rarity": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <div class=\"text-center\" style=\"margin: 20px;\">\n    <div class=\"alert\" style=\"background-color: #CCDC90; color: #333333; border-radius: 15px; padding: 10px; display: inline-block;\">\n        <b>Overview of the Rarity Class<\/b>\n        <br>\n        The Rarity class is a static helper class and defines the properties and characteristics of objects based on their rarity levels.\n        The system is flexible, allowing for easy customization through a configuration table.\n        Each rarity level is associated with unique attributes, which can impact gameplay, item appearance, and player experience.\n    <\/div>\n<\/div>\n\n<table class=\"table table-bordered\">\n    <thead>\n        <tr>\n            <th style=\"background-color: #CCDC90; color: #000000;\">Aspect<\/th>\n            <th style=\"background-color: #CCDC90; color: #000000;\">Description<\/th>\n        <\/tr>\n    <\/thead>\n    <tbody style=\"background-color: #3F3F3F; color: #DCDCCC;\">\n        <tr>\n            <td><b>Affix System<\/b><\/td>\n            <td>Defines the maximum tier of affixes applicable to items, influencing their capabilities and attributes.<\/td>\n        <\/tr>\n        <tr>\n            <td><b>Rarity Levels<\/b><\/td>\n            <td>Specifies multiple rarity levels, each with distinct characteristics affecting item drop rates, appearances, and enhancements.<\/td>\n        <\/tr>\n        <tr>\n            <td><b>Color Coding<\/b><\/td>\n            <td>Each rarity level can have an associated color for visual differentiation in the UI, enhancing user experience.<\/td>\n        <\/tr>\n        <tr>\n            <td><b>Chance Mechanism<\/b><\/td>\n            <td>Establishes the probability of obtaining items of varying rarities, allowing for balanced item distribution.<\/td>\n        <\/tr>\n        <tr>\n            <td><b>Affix Tiers<\/b><\/td>\n            <td>Sets the minimum and maximum affix tiers for each rarity level, impacting the potential power and utility of items.<\/td>\n        <\/tr>\n        <tr>\n            <td><b>Prefix and Suffix Ranges<\/b><\/td>\n            <td>Defines the numeric range of prefixes and suffixes that can be assigned to items, further diversifying their properties and effects.<\/td>\n        <\/tr>\n    <\/tbody>\n<\/table><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Note<\/div><div class=\"section-content\">   Configuration is validated when this module loads: all lists must be dense and the\nsame length, level names unique, colors #RRGGBB, chances descending integer thresholds\nin [0,100] beginning at 100, and affix tiers/counts valid ordered ranges. Equal chance\nthresholds permit zero-probability levels. Validated lists are retained as private snapshots.\n\nThe Rarity system's configuration is designed for customization on a per-game basis, enabling developers to establish unique rarity systems tailored to their specific game mechanics and aesthetics. However, once the game is running, the configuration data is immutable and cannot be altered during gameplay. This intentional design choice ensures that the rarity framework remains stable and consistent, preventing any tampering or unintended modifications while the game is in execution. By restricting changes to the configuration file outside of gameplay, developers can maintain the integrity of the game's mechanics, fostering a reliable experience for players.<\/div><\/div><\/div>`,

            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates systems for randomized, non-repeating selection from a set of items, with support for resetting once all items have been selected. It maintains two internal tables: the pool, which stores all added items, and the buffer, a shuffled working copy used for pulling items via pop(). By default, when the buffer is emptied through pop(), it automatically resets by refilling from the pool.<\/div><\/div><\/div>`,

                "remove": {

        "StatusTracker": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   A lightweight configured-status tracker with private per-instance state.\nDuration is nonnegative; active state is separate. Reaching zero deactivates only\nstatuses whose doesExpire flag is true. Cycling uses a unit chosen by the caller.\nNo inheritance, gameplay effects, stacking, resistance or RNG policy is imposed.\nMethods use dot calls and accept descendant effect enums or exact scoped paths.<\/div><\/div><div class=\"custom-section\"><div id=\"f86d1752-9c6e-a8ff-1b52-171fae11d19d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local oStatuses = StatusTracker(StatusTracker.ALL_THINGS.PEOPLE);\n-- After defining ALL_THINGS.PEOPLE = {\"HASTENED\"} in the user CoG config:\noStatuses.activate(\"HASTENED\", 5, true);\noStatuses.cycle(1);<\/code><\/pre><\/div><\/div><\/div>`,
            "subtable": {
            "Helpers": {
                "value": ``,
                "subtable": {
                "getState": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Copies all configured records for iteration, cloning and serialization.\n    Does not expose this instance's private mutable status tables.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Scope<\/div><div class=\"section-content\">   local<\/div><\/div><div class=\"custom-section\"><div id=\"1279367b-10f4-1093-caa5-996ae4f1eaa9\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tState<\/em>   Independent statuses map.<br><\/div><\/div><\/div>`,

                "validateDuration": {

                "validateState": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Validates complete serialized state before allocating live storage. Unknown names,\nextra fields and inconsistent active expiring statuses are rejected.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Scope<\/div><div class=\"section-content\">   local<\/div><\/div><div class=\"custom-section\"><div id=\"fb59c256-d7f3-87ca-f3fd-9a4c44147924\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tState<\/em>   State containing a configured category scope path and relative status records.<br><\/div><\/div><\/div>`,

            "Methods": {
                "value": ``,
                "subtable": {
                "StatusTracker": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates independent storage for descendants of a configured category. Initially inactive, duration zero,\nand doesExpire true. The optional state argument is private to clone/deserialization.<\/div><\/div><div class=\"custom-section\"><div id=\"d5bdc0d6-ab8d-e388-9f40-667850d4a6f5\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>enum<\/em><\/strong>   <em>eScope<\/em>   Configured category enum; terminal effect members are rejected.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e76cfd3c-01b7-cb2e-0336-b7f1a373f3fb\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>StatusTracker<\/em><\/strong>   <em>oStatuses<\/em>   New tracker.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "activate": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Activates a configured status with optional duration/expiration overrides.\n        Omitted arguments retain current settings. An expiring zero-duration status remains\n        inactive. Reapplication replaces supplied settings rather than stacking.<\/div><\/div><div class=\"custom-section\"><div id=\"b6c8c59a-4878-162b-2d2c-6b341a25736d\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string|enum<\/em><\/strong>   <em>vEffect<\/em>   Configured status.   <strong><em>number|nil<\/em><\/strong>   <em>nDuration<\/em>   Optional finite nonnegative duration.   <strong><em>boolean|nil<\/em><\/strong>   <em>bDoesExpire<\/em>   Optional expiration flag.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f1272df3-5c79-6e03-1acd-04c7de6fef89\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bActive<\/em>   Resulting active state.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "adjustDuration": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adds a finite signed delta, clamping at zero. Never converts underflow to infinity.\n        Overflow is rejected before mutation; adjustment does not activate an inactive status.<\/div><\/div><div class=\"custom-section\"><div id=\"b0166657-7cad-9f9e-50e1-458d127a51aa\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string|enum<\/em><\/strong>   <em>vEffect<\/em>   Configured status.   <strong><em>number<\/em><\/strong>   <em>nDelta<\/em>   Finite signed duration change.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d0723ad5-39c4-c540-bf4c-dffd0e300f09\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>StatusTracker<\/em><\/strong>   <em>oStatuses<\/em>   This tracker for chaining.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "clear": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Deactivates all statuses and clears durations, retaining expiration settings.<\/div><\/div><div class=\"custom-section\"><div id=\"ba3cd282-cf63-45c3-fe99-cf8c8bd67992\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nCleared<\/em>   Number of previously active statuses.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "cycle": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Advances active timers by the caller's chosen amount. Durations clamp at zero;\n        only statuses with doesExpire=true deactivate there. Inactive timers do not advance.<\/div><\/div><div class=\"custom-section\"><div id=\"1e989927-62a3-dfec-dc0b-9efb59ca874d\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nStep<\/em>   Finite nonnegative step; defaults to one.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ed61f44a-1af8-76ba-106e-770cd5dc3974\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nExpired<\/em>   Count deactivated by this cycle.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "deactivate": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Explicitly stops a status, including one that does not expire. Retains its settings.<\/div><\/div><div class=\"custom-section\"><div id=\"e10e81cd-31ef-f78b-eca2-b5fad68145a5\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string|enum<\/em><\/strong>   <em>vEffect<\/em>   Configured status.<br><\/div><\/div><div class=\"custom-section\"><div id=\"aee0096f-c502-2911-667e-863b60f65371\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bChanged<\/em>   True if it was active before this call.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "deserialize": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Restores independent private state using the current configured status names.<\/div><\/div><div class=\"custom-section\"><div id=\"17117070-9e22-a896-f9cc-e999bfb85778\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tState<\/em>   Plain state produced by __serialize.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ae384f38-300b-86a9-3165-c6b741c660d3\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>StatusTracker<\/em><\/strong>   <em>oStatuses<\/em>   Restored tracker.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "doesExpire": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Reports whether reaching zero automatically deactivates this status.<\/div><\/div><div class=\"custom-section\"><div id=\"97378f0a-0a2c-1d4f-1ecb-0873986fc4ab\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string|enum<\/em><\/strong>   <em>vEffect<\/em>   Configured status.<br><\/div><\/div><div class=\"custom-section\"><div id=\"36f8fbbe-481f-9036-bf86-0d216b72495d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bDoesExpire<\/em>   Current expiration policy.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "eachStatus": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Iterates scope-relative paths and copied records in deterministic configured order.\n        Includes inactive statuses. Later tracker changes do not alter the snapshot.<\/div><\/div><div class=\"custom-section\"><div id=\"cf304ea6-e15a-8367-71b6-0c09c07508c7\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>function<\/em><\/strong>   <em>fIterator<\/em>   Iterator returning name, state record.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getDuration": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Returns remaining duration in the caller's time unit.<\/div><\/div><div class=\"custom-section\"><div id=\"8528eeb5-af95-01e2-2fe8-2e91a8768482\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string|enum<\/em><\/strong>   <em>vEffect<\/em>   Configured status.<br><\/div><\/div><div class=\"custom-section\"><div id=\"45d4976b-7e23-8798-9137-a512cab91a03\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nDuration<\/em>   Finite nonnegative duration.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isActive": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Reports explicit active state, independently of an indefinite status's duration.<\/div><\/div><div class=\"custom-section\"><div id=\"85444948-ebf7-bc3c-39c9-8d4b9580d046\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string|enum<\/em><\/strong>   <em>vEffect<\/em>   Configured status.<br><\/div><\/div><div class=\"custom-section\"><div id=\"0ba8608f-fabc-dbb1-857c-02acabff2344\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bActive<\/em>   Current active flag.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setDoesExpire": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Changes expiration policy. Enabling expiration at zero immediately deactivates.\n        Disabling expiration does not automatically activate an inactive status.<\/div><\/div><div class=\"custom-section\"><div id=\"e0f93ebb-b262-6b4d-88f6-623a5013f752\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string|enum<\/em><\/strong>   <em>vEffect<\/em>   Configured status.   <strong><em>boolean<\/em><\/strong>   <em>bFlag<\/em>   Whether reaching zero should stop the status.<br><\/div><\/div><div class=\"custom-section\"><div id=\"461c9e24-35ea-89c4-503d-69b387aa9f59\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>StatusTracker<\/em><\/strong>   <em>oStatuses<\/em>   This tracker for chaining.<br><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setDuration": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Replaces duration without activating an inactive status. Zero deactivates an\n        expiring status, but leaves a non-expiring status's active state unchanged.<\/div><\/div><div class=\"custom-section\"><div id=\"21fd96e1-7338-cc8a-353b-7c92adb11879\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string|enum<\/em><\/strong>   <em>vEffect<\/em>   Configured status.   <strong><em>number<\/em><\/strong>   <em>nDuration<\/em>   Finite nonnegative remaining duration.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1bf541db-1f29-093a-eef9-b83bdc3bcbf4\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>StatusTracker<\/em><\/strong>   <em>oStatuses<\/em>   This tracker for chaining.<br><\/div><\/div><\/div>`,
                    "subtable": null
                }

        "StructureSystem": {
            "value": ``,
            "subtable": {
            "CoGStructure": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Marker subclass identifying structures through type.isCoGStructure,\n    including derived classes. Inherits CoGObject metadata, rarity, tags, events\n    and an owned AffixSystem. Developers define additional gameplay state in\n    subclasses; higher-level world systems manage position and placement.\n    The protected constructor is called by concrete subclasses through super.<\/div><\/div><\/div>`,
                "subtable": {
                "InheritedCoGObject": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Shared CoG object metadata, tags and event dispatch. Concrete subclasses call the protected constructor.\n    Names and descriptions must contain non-whitespace text. Rarity falls back to the first configured level.\n    <ul>\n    <li>getName() and getDescription() expose protected strings; no replacement setters are generated.<\/li>\n    <li>getRarity() exposes rarity; setRarity(eRarity) checks the owned AffixSystem before changing it.<\/li>\n    <li>getAffixSystem() returns the owned component; affix behavior resides in AffixSystem.<\/li>\n    <li>getTagSystem() is final and returns the mutable per-object TagSystem; no replacement setter is generated.<\/li>\n    <li>fireEvent(eEventID, ...) is final and delegates to this object's eventrix.<\/li>\n    <\/ul><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "Methods": {
                    "value": ``,
                    "subtable": {
                    "CoGStructure": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Protected constructor. Concrete subclasses call it through super\n        to initialize inherited CoGObject state and independent components.<\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Visibility<\/div><div class=\"section-content\">   Protected<\/div><\/div><div class=\"custom-section\"><div id=\"3da9de70-dbcf-9573-f468-d32e776ccef2\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sName<\/em>   Structure name containing non-whitespace text.   <strong><em>string<\/em><\/strong>   <em>sDescription<\/em>   Structure description containing non-whitespace text.   <strong><em>Rarity.LEVEL|nil<\/em><\/strong>   <em>eRarity<\/em>   Inherited rarity; defaults to the first configured level.   <strong><em>string|nil<\/em><\/strong>   <em>wEventrix<\/em>   Optional registered event environment name.<br><\/div><\/div><div class=\"custom-section\"><div class=\"section-title\">Throws<\/div><div class=\"section-content\">   Invalid metadata or inherited initialization errors.<\/div><\/div><\/div>`,
                        "subtable": null

                    }

                }
            }
            }
        },
        "TagSystem": {
            "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   A lightweight system for managing unique, case-insensitive tags. Leading and\ntrailing whitespace is trimmed, tags are stored uppercase, and iteration is\nalphabetical. Disabled tags remain members and count toward length and equality.\nMethods use dot calls: oTags.add(\"GHOST\"). Instance state is private to build.<\/div><\/div><div class=\"custom-section\"><div id=\"acf6108f-6b35-daef-3211-541ab79355a6\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">local oTags = TagSystem();\noTags.addMultiple({\" Ghost \", \"Undead\"});<\/code><\/pre><\/div><\/div><\/div>`,
            "subtable": {

                        "subtable": null
                    },
                    "configureRover": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Applies imported rover responses and movement settings through native AStar APIs.\n    Callbacks and complex passage rules remain programmable after import.<\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "create": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates an independent native AStar map. Options select tile layer IDs/names,\n    optional finite bounds {x,y,width,height}, and a configureNode callback.\n    Infinite maps use occupied chunk bounds; holes are blocked. Staggered diamonds\n    use native four-edge staggered adjacency.<\/div><\/div><div class=\"custom-section\"><div id=\"6f70e972-52dd-41ea-977c-fe66fc2fc186\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tBridge<\/em>   Native system/map plus layer, object-node and rover lookup tables.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "effective": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Resolves node defaults in order: map, tileset, tile, ancestor groups, layer.\n    Explicit layer fields override the corresponding inherited fields.<\/div><\/div><div class=\"custom-section\"><div id=\"2739fa0a-b299-ea7f-8527-23aef25d0b89\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tSettings<\/em>   Effective node settings.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "merge": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Recursively overlays settings, preserving parent fields absent from the child.<\/div><\/div><div class=\"custom-section\"><div id=\"dd067510-99de-da55-bcd2-753f3989ca9f\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tResult<\/em>   Independent merged settings.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "objectCell": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Resolves explicit native tileX/tileY, or projects a TMX object anchor to the\n    target tile layer. Isometric object pixels are unprojected Tiled coordinates.<\/div><\/div><div class=\"custom-section\"><div id=\"6fa1629e-b4af-bd58-4050-dc36b7071750\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nX<\/em>   Native column.   <strong><em>number<\/em><\/strong>   <em>nY<\/em>   Native row.<br><\/div><\/div><\/div>`,
                        "subtable": null
                    },
                    "settings": {
                        "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Extracts the grouped AStar class property. Its propertytype is descriptive;\n    its exact property name, AStar, selects the integration settings.<\/div><\/div><div class=\"custom-section\"><div id=\"6a27f32a-04a6-4a1f-9712-0cab436818b7\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tSettings<\/em>   Plain application settings, or empty when absent.<br><\/div><\/div><\/div>`,
                        "subtable": null
