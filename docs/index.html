    <style>
            :root {
        --base-font-size: 16px;

    /* Page shell and compact project identity. */
    * { box-sizing: border-box; }
    html { font-size: var(--base-font-size); }
    body {
        margin: 0;
        background: var(--page);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
        line-height: 1.65;
    }
    a { color: var(--accent); }
    a:hover { color: var(--link-hover); }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    #titlebg {
        padding: 24px 36px 22px;
        background: linear-gradient(120deg, var(--header-start), var(--header-end));
        border-bottom: 1px solid var(--border);
    }
    .dox-brand { color: var(--accent); font-weight: 800; letter-spacing: .14em; font-size: .85rem; }
    .dox-brand span { margin-left: 12px; color: var(--muted); font-size: .7rem; font-weight: 600; }
    #title { font-size: clamp(1.5rem, 3vw, 2.1rem); font-weight: 700; margin: 8px 0 0; letter-spacing: -.025em; }
    .dox-subtitle { margin: 3px 0 0; color: var(--muted); font-size: .85rem; }

    /* Breadcrumbs and selected items show the current location without relying on color alone. */
    #DOX_breadcrumb-wrapper { padding: 13px 36px; background: var(--breadcrumb-background); border-bottom: 1px solid var(--border); }
    #DOX_breadcrumb { margin: 0; display: flex; flex-wrap: wrap; gap: 8px; list-style: none; padding: 0; font-size: .9rem; }
    .breadcrumb-item + .breadcrumb-item::before { content: "/"; color: var(--muted); padding-right: 8px; float: none; }
    .breadcrumb-item.active { color: var(--text); font-weight: 700; }
    .breadcrumb a { text-decoration: none; }
    .dox-workspace { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: calc(100vh - 185px); }
    #DOX_navmenu_wrapper { background: var(--surface); padding: 26px 18px; border-right: 1px solid var(--border); }
    #DOX_navheading { font-size: .75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 0 12px; margin: 0 0 14px; overflow-wrap: anywhere; }
    #DOX_navmenu { margin: 0; padding: 0; list-style: none; gap: 5px; }
    #DOX_navmenu .nav-link { display: block; color: var(--navlink); padding: 11px 14px; border: 1px solid transparent; border-radius: 8px; text-decoration: none; overflow-wrap: anywhere; }
    #DOX_navmenu .nav-link:hover { background: var(--surface-raised); color: var(--navlinkhover); border-color: var(--border); }
    #DOX_navmenu .nav-link.active { background: var(--accent-soft); border-color: var(--selected-border); color: var(--selected-text); font-weight: 700; box-shadow: inset 3px 0 var(--accent); }
    #DOX_navmenu .dox-up { color: var(--muted); font-size: .85rem; margin-bottom: 10px; }

    /* Content cards separate documentation sections while keeping examples readable. */
    #DOX_content_wrapper { padding: 28px 36px 60px; min-width: 0; }
    .dox-topic-header { margin: 0 auto 24px; max-width: 1050px; }
    #DOX_location { color: var(--muted); font-size: .8rem; margin: 0 0 4px; overflow-wrap: anywhere; }
    #DOX_topic { font-size: 1.75rem; letter-spacing: -.025em; margin: 0; overflow-wrap: anywhere; }
    #DOX_content { max-width: 1050px; margin: 0 auto; }
    #DOX_content > .container-fluid { padding: 0; }
    .custom-section { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 18px; background: var(--surface); overflow: hidden; box-shadow: 0 5px 18px #0002; }
    .section-title { padding: 12px 20px; background: var(--sectiontitlebg); color: var(--sectiontitle); font-size: .85rem; font-weight: 700; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .section-content { color: var(--sectioncontent); padding: 20px; overflow-wrap: anywhere; }
    .section-content > :last-child { margin-bottom: 0; }
    .dox-empty { padding: 28px; border: 1px dashed var(--border); border-radius: 12px; color: var(--muted); }
    .DOX_intro { color: var(--text); }
    .DOX_intro .p-5 { padding: 28px !important; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    .DOX_intro h1 { font-size: 1.6rem; }
    .DOX_intro .lead { font-size: 1rem; color: var(--muted); }
    pre { white-space: pre-wrap !important; overflow-wrap: anywhere; border-radius: 8px; font-size: .9rem; }
    .copy-to-clipboard-button { background: var(--button-background); color: var(--button-text); border: 1px solid var(--button-border); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: .8rem; }
    .copy-to-clipboard-button:hover { background: var(--button-hover); }
    .section-content table { color: var(--text); --bs-table-bg: transparent; --bs-table-color: var(--text); --bs-table-border-color: var(--border); --bs-table-striped-color: var(--text); }

    /* Narrow screens retain both navigation and content without horizontal page overflow. */
    @media (max-width: 760px) {
        #titlebg, #DOX_breadcrumb-wrapper { padding-left: 20px; padding-right: 20px; }
        .dox-workspace { grid-template-columns: 1fr; }
        #DOX_navmenu_wrapper { border-right: 0; border-bottom: 1px solid var(--border); padding: 18px; }
        #DOX_navmenu { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
        #DOX_content_wrapper { padding: 24px 18px 40px; }
        .section-content { padding: 16px; }
    }

            "AStar": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   <p>AStar is an versatile A* pathfinding system designed for detailed game development.\n    It has weighted <a href=\"#CoG.AStar.AStarNode\">Nodes<\/a> that respond to the\n    <a href=\"#CoG.AStar.AStarRover\">Rovers<\/a> moving through them. That is, a\n    <b>Node's<\/b> weight is based not only on the <b>Node<\/b> properties but also on the\n    <b>Rover's<\/b> affinities or aversions to that node.\n    <br>For example, a human walking on solid, flat ground would move much faster than if he were\n    walking on a muddy slope.\n    <br><br>\n    The system uses various private, public and publicly-available classes.\n    <h4>Private Classes<\/h4>\n    <ul>\n        <li><a href=\"#CoG.AStar.AStarAspect\">AStarAspect<\/a><\/li>\n        <li><a href=\"#CoG.AStar.AStarLayer\">AStarLayer<\/a><\/li>\n        <li><a href=\"#CoG.AStar.AStarMap\">AStarMap<\/a><\/li>\n        <li><a href=\"#CoG.AStar.AStarNode\">AStarNode<\/a><\/li>\n        <li><a href=\"#CoG.AStar.AStarRover\">AStarRover<\/a><\/li>\n    <\/ul>\n    <h4>Public Classes<\/h4>\n    <ul>\n        <li><a href=\"#CoG.AStar.AStar\">AStar<\/a><\/li>\n    <\/ul>\n    <h4>Publicly-available Classes<\/h4>\n    <ul>\n        <li><a href=\"#CoG.AStar.AStarLayerConfig\">AStarLayerConfig<\/a><\/li>\n        <li><a href=\"#CoG.AStar.AStarPath\">AStarPath<\/a><\/li>\n    <\/ul>\n    These two classes are available in <b>AStar's<\/b> static public table.\n    <b>AStar.LayerConfig<\/b>\n    <b>AStar.Path<\/b>\n    <br>Create maps with newMap, configure rover Pools, construct AStar.Path for preview and call path.step to execute one group move.<\/div><\/div><div class=\"custom-section\"><div id=\"6d8c27e8-2899-1346-5e55-a79587577363\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oAStar         = AStar(\"Rock\", \"Sand\", \"Marsh\");\n    local oASLayerConfig = AStar.LayerConfig(\"Rock\", \"Sand\");\n    local oMap           = oAStar.newMap(\"Nirn\", ASTAR_MAP_TYPE_HEX_FLAT, {oASLayerConfig}, 40, 40, {staggerAxis = \"x\", staggerIndex = \"odd\"});<\/code><\/pre><\/div><\/div><\/div>`,
                "subtable": {
                "AStar": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates a system with zero or more unique aspect names. Names must be Lua identifiers and are stored in uppercase and sorted alphabetically. Duplicates are rejected without regard to case.<\/div><\/div><div class=\"custom-section\"><div id=\"8c37ff5a-44c9-92b5-6d5c-48479589cd0f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>...<\/em>   The available aspect names.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1a8dd0a8-8597-ed69-6f4d-459d0abd5e9f\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStar<\/em><\/strong>   <em>oSystem<\/em>   The new system.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ebfdb3ff-0af2-2b0d-02be-e8677c3cd70a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\", \"rock\");\n    assert(oSystem.aspectNames.MUD == \"MUD\" and #oSystem.aspectNames == 2);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "Constants": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Read-only static geometry and entry-cost constants. MAP_TYPE_HEX_FLAT, MAP_TYPE_HEX_POINTED, MAP_TYPE_SQUARE, MAP_TYPE_STAGGERED, MAP_TYPE_TRIANGLE_FLAT and MAP_TYPE_TRIANGLE_POINTED select geometry. NODE_ENTRY_COST_BASE is 10, MIN is 1, MAX_RATE is 12 and MAX is 120. Existing ASTAR_ global names retain identical values. Costs may be fractional.<\/div><\/div><div class=\"custom-section\"><div id=\"4955d668-1bf0-b8f3-46bb-599d47d155fa\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    assert(AStar.MAP_TYPE_SQUARE == ASTAR_MAP_TYPE_SQUARE);\n    assert(AStar.NODE_ENTRY_COST_MAX == 120);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "aspectNames": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   A read-only, case-insensitive lookup of this system's uppercase aspect names. Length gives the aspect count; pairs visits the names in alphabetically sorted numeric order. No aspects may be added after construction.<\/div><\/div><div class=\"custom-section\"><div id=\"5aa1db87-ce71-6f13-0902-aed356dd0860\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tNames<\/em>   The aspect-name view.<br><\/div><\/div><div class=\"custom-section\"><div id=\"a975c13c-0b43-cc26-8f7f-68244e429b5f\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"rock\", \"mud\");\n    assert(oSystem.aspectNames.mud == \"MUD\" and #oSystem.aspectNames == 2);\n    local tNames = {};\n    for nIndex, sName in pairs(oSystem.aspectNames) do\n        tNames[nIndex] = sName;\n    end\n    assert(tNames[1] == \"MUD\" and tNames[2] == \"ROCK\");<\/code><\/pre><\/div><\/div><\/div>`,

                "getMap": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a map by its exact, case-sensitive name.<\/div><\/div><div class=\"custom-section\"><div id=\"39d91fe3-a2be-ece3-7c8c-8a68351a62aa\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sName<\/em>   A nonblank map name.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2529e28c-58fe-0542-0a48-2c228fa203ce\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarMap|nil<\/em><\/strong>   <em>oMap<\/em>   The map, or nil when absent.<br><\/div><\/div><div class=\"custom-section\"><div id=\"dc33f794-1812-e569-847b-584b57748318\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    assert(oSystem.getMap(\"world\") == oMap and oSystem.getMap(\"WORLD\") == nil);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getMaps": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a read-only view of maps indexed by their exact names.<\/div><\/div><div class=\"custom-section\"><div id=\"7d60815d-8d8e-9841-d187-0b4ed52c478c\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tMaps<\/em>   The map view.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4fa2a9e6-390f-17d8-312b-0cc3f340c4f4\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    assert(oSystem.getMaps().world == oMap);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getNode": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a node by exact map name, case-insensitive layer name and native coordinates.<\/div><\/div><div class=\"custom-section\"><div id=\"67c9c05b-3e58-f167-67b6-4f50df7d2655\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sMap<\/em>   A nonblank map name.   <strong><em>string<\/em><\/strong>   <em>sLayer<\/em>   A nonblank layer name.   <strong><em>number<\/em><\/strong>   <em>nX<\/em>   The integer x coordinate.   <strong><em>number<\/em><\/strong>   <em>nY<\/em>   The integer y coordinate.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d405a3ae-da16-5ba1-0c0e-6662a820f330\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode|nil<\/em><\/strong>   <em>oNode<\/em>   The node, or nil when the map, layer or position is absent.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c3578f87-9f4f-578d-57b8-1656ab3e046e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    assert(oSystem.getNode(\"world\", \"GROUND\", 1, 1) == oMap.getNode(\"ground\", 1, 1));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "newMap": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates and registers a named map. Existing exact names return nil without replacing the map. Layer configurations must be nonempty, ordered, uniquely named and use this system's aspects. Native origins default to 1. Hex and staggered diamond maps require explicit staggerAxis and staggerIndex settings for neighbor generation, corresponding to Tiled's staggeraxis and staggerindex values. Tiled.toAStar imports TMX into this native map system.<\/div><\/div><div class=\"custom-section\"><div id=\"20d74eda-7a8e-34cb-de9c-e67dc205a373\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sName<\/em>   A nonblank, case-sensitive map name.   <strong><em>number<\/em><\/strong>   <em>nType<\/em>   A supported map geometry constant.   <strong><em>table<\/em><\/strong>   <em>tLayers<\/em>   An ordered list of AStar.LayerConfig objects.   <strong><em>number<\/em><\/strong>   <em>nWidth<\/em>   The positive integer grid width.   <strong><em>number<\/em><\/strong>   <em>nHeight<\/em>   The positive integer grid height.   <strong><em>table|nil<\/em><\/strong>   <em>tLayout<\/em>   Optional originX, originY, staggerAxis and staggerIndex.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bd7a80db-1724-f1c4-3fb4-b6d94b6527ae\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarMap|nil<\/em><\/strong>   <em>oMap<\/em>   The new map, or nil when its name already exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"16d1e2a3-7752-fe43-4255-7119f068711a\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    assert(oMap.getWidth() == 3 and oMap.getHeight() == 2);\n    assert(oSystem.newMap(\"world\") == nil); --existing exact name is preserved<\/code><\/pre><\/div><\/div><\/div>`,

            "AStarAspect": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   A named aspect belonging to a node. Its Protean impactor represents the aspect's intensity from 0 to 1 and automatically recalculates when its values change.<\/div><\/div><\/div>`,

                "subtable": {
                "AStarMap": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates a map and its layers. Requires an ordered, nonempty list of layer configurations with unique names. Every configured aspect must belong to the owning AStar.<\/div><\/div><div class=\"custom-section\"><div id=\"ca276d66-78a3-a0ff-48eb-4c2f977428dc\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStar<\/em><\/strong>   <em>oAStar<\/em>   The owning system.   <strong><em>string<\/em><\/strong>   <em>sName<\/em>   A nonblank map name.   <strong><em>number<\/em><\/strong>   <em>nMapType<\/em>   A declared map type constant.   <strong><em>table<\/em><\/strong>   <em>tLayerConfigs<\/em>   The ordered layer configurations.   <strong><em>number<\/em><\/strong>   <em>nWidth<\/em>   The positive integer grid width.   <strong><em>number<\/em><\/strong>   <em>nHeight<\/em>   The positive integer grid height.   <strong><em>table|nil<\/em><\/strong>   <em>tLayout<\/em>   Optional originX/originY (default 1) and paired staggerAxis/staggerIndex settings.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f480b08b-dff8-a2d8-2cd1-2def7aad3336\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarMap<\/em><\/strong>   <em>oMap<\/em>   The new map.<br><\/div><\/div><div class=\"custom-section\"><div id=\"6989a28e-bc5f-c1ff-97fe-2af0b420a03d\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    assert(type(oMap) == \"AStarMap\"); --created with newMap<\/code><\/pre><\/div><\/div><\/div>`,

                "__tostring": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Describes map name, dimensions, geometry, layer names and node count per layer.<\/div><\/div><div class=\"custom-section\"><div id=\"505cd846-b4ea-3ace-d057-eb37b49e53e3\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sDescription<\/em>   The map description.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b3a40509-97db-9cc7-f8d3-a2f13ddba741\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    assert(tostring(oMap):find(\"world\", 1, true));<\/code><\/pre><\/div><\/div><\/div>`,

                },

                    "subtable": null
                },
                "getStagger": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the explicitly supplied stagger axis and index. No staggering convention is inferred when none was supplied. Parity refers to native map coordinates.<\/div><\/div><div class=\"custom-section\"><div id=\"95004a17-8d0e-9034-5ca3-cc8fe37176d8\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tStagger<\/em>   A new table with axis and index fields, or an empty table when unspecified.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2f6a31cb-6a9c-287f-bb18-8f65633c6d76\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oHex = oSystem.newMap(\"hex\", ASTAR_MAP_TYPE_HEX_FLAT, {AStar.LayerConfig(\"ground\")}, 2, 2,\n        {staggerAxis = \"x\", staggerIndex = \"odd\"});\n    local tStagger = oHex.getStagger();\n    assert(tStagger.axis == \"x\" and tStagger.index == \"odd\");<\/code><\/pre><\/div><\/div><\/div>`,

                "getType": {

                "getWidth": {

            "AStarNode": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   A location in a layer. Owns terrain aspects, resident rovers and outgoing port connections. Entry cost depends on each rover's affinities and aversions; passability depends on the node flag, active aspects and resident rover restrictions. Ports may be one-way or two-way.<\/div><\/div><\/div>`,
                "subtable": {
                "AStarNode": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates a node belonging to a layer, with its position, map type and zero or more aspects. Aspect names are stored in uppercase; each aspect starts with full intensity.<\/div><\/div><div class=\"custom-section\"><div id=\"ecd4a677-b742-f60d-c1f3-a396e94c1b13\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarLayer<\/em><\/strong>   <em>oAStarLayer<\/em>   The owning layer.   <strong><em>number<\/em><\/strong>   <em>nX<\/em>   The integer x coordinate in the map's native coordinate system.   <strong><em>number<\/em><\/strong>   <em>nY<\/em>   The integer y coordinate in the map's native coordinate system.   <strong><em>table<\/em><\/strong>   <em>tAspects<\/em>   An ordered list of aspect names; an empty list is allowed.<br><\/div><\/div><div class=\"custom-section\"><div id=\"bfdc5b6a-25a6-70ba-f75b-5ccbd7920723\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The new node.<br><\/div><\/div><div class=\"custom-section\"><div id=\"37dddfbf-858b-a76c-71ff-e8e120ac4fe1\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    assert(type(oNode) == \"AStarNode\"); --created with its layer<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "addPort": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Adds an outgoing port connection. By default, also updates the reverse connection. A one-way operation leaves any existing reverse connection unchanged.<\/div><\/div><div class=\"custom-section\"><div id=\"dfdda0e4-7da2-e150-680b-831b9258179e\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The connected node.   <strong><em>boolean|nil<\/em><\/strong>   <em>bTwoWay<\/em>   Whether to update both directions; defaults to true. False updates only this node's outgoing connection.   <strong><em>function|nil<\/em><\/strong>   <em>fPassageRule<\/em>   An optional predicate (rover, sourceNode, destinationNode) returning boolean. Applied to each direction added; omitted rules preserve existing rules. Keep predicates side-effect-free for route planning.<br><\/div><\/div><div class=\"custom-section\"><div id=\"009a4e45-391b-a360-e3ff-12826ee9f95d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   This node, for chaining.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d90d9293-7f93-fe10-44ab-ab19e84226ff\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oExit = oMap.getNode(\"ground\", 3, 2);\n    oNode.addPort(oExit, false);\n    assert(oNode.hasPort(oExit) and not oExit.hasPort(oNode));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "canTraverseTo": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether a physical edge or an allowed outgoing port connects this node to the destination for every supplied rover. A physical edge permits traversal independently of any parallel port restriction. Destination passability and movement budgets are checked separately by planning and movement.<\/div><\/div><div class=\"custom-section\"><div id=\"fd108738-d32a-713c-7fa2-e03094cb6d9a\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The destination.   <strong><em>AStarRover|table<\/em><\/strong>   <em>...<\/em>   One or more rovers, individually or in an ordered table.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c9e02036-a3e0-6cd5-1e5d-abd134fdd57d\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bConnected<\/em>   Whether a permitted connection exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5588078c-80eb-540c-9e23-8f935e2079d9\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    assert(oNode.canTraverseTo(oMap.getNode(\"ground\", 2, 1), oRover));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "canUsePort": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks outgoing port existence and passage permission for every supplied rover, independently of node passability, occupancy, movement points and the rovers' current positions. A missing port returns false; a port without a rule allows passage.<\/div><\/div><div class=\"custom-section\"><div id=\"c6a9f34a-e6f7-cd65-8db1-9eca8342f2c9\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The destination.   <strong><em>AStarRover|table<\/em><\/strong>   <em>...<\/em>   One or more rovers, individually or in an ordered table.<br><\/div><\/div><div class=\"custom-section\"><div id=\"211838e7-dad4-6649-d074-67eb8fb61e0c\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bAllowed<\/em>   Whether every rover may use this port.<br><\/div><\/div><div class=\"custom-section\"><div id=\"fc0432c6-27bc-6722-fc52-7f907977be91\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oExit = oMap.getNode(\"ground\", 3, 2);\n    oNode.addPort(oExit, false);\n    assert(oNode.canUsePort(oExit, oNode.createRover()));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "containsRover": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether the supplied rover occupies this node.<\/div><\/div><div class=\"custom-section\"><div id=\"3fff710d-b68a-30c4-56c2-d8d3dc89b470\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   The rover to check.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2c98c76e-3ee6-49f7-dfd5-dcfaf227a9d6\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bContains<\/em>   Whether the rover is registered on this node.<br><\/div><\/div><div class=\"custom-section\"><div id=\"b9e076f4-97f9-4c39-448b-49f4b9c483c9\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    assert(oNode.containsRover(oRover));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "createRover": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Creates a rover on this node and registers it as an occupant.<\/div><\/div><div class=\"custom-section\"><div id=\"817e2164-70dd-61c7-063b-7c8a20744245\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>boolean|nil<\/em><\/strong>   <em>bRetainsPointsOverCycle<\/em>   Whether unused points carry into the next cycle; defaults to true.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5e2a01b5-331c-a7f2-7b43-4a3a8acccbaa\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   The new rover.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4097449e-13a3-e532-a70f-ff3d1f85f0fb\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover(false);\n    assert(oRover.getOwner() == oNode and not oRover.retainsPointsOverCycle());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getAspect": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets an aspect using a case-insensitive name lookup.<\/div><\/div><div class=\"custom-section\"><div id=\"9e3ecb87-545b-6a49-0b93-cb037ecf05db\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sAspect<\/em>   A nonblank aspect name.<br><\/div><\/div><div class=\"custom-section\"><div id=\"6ea441c3-17e6-58a4-96a4-96ce995efbe1\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarAspect|nil<\/em><\/strong>   <em>oAspect<\/em>   The aspect, or nil when absent.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ed10b745-8a28-c29c-4eee-4e0ed02a57af\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    assert(oNode.getAspect(\"mud\").getName() == \"MUD\");<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getAspectImpact": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets an aspect's calculated intensity using a case-insensitive name lookup.<\/div><\/div><div class=\"custom-section\"><div id=\"65722293-b465-23a5-b0a3-6af4520173ad\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sAspect<\/em>   A nonblank aspect name.<br><\/div><\/div><div class=\"custom-section\"><div id=\"08cbe926-67d1-9f8c-2498-98d61c9fe7c1\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nImpact<\/em>   The final intensity from 0 to 1, or nil when the aspect is absent.<br><\/div><\/div><div class=\"custom-section\"><div id=\"547a63aa-b444-e954-8128-6aaf6bc666fe\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    assert(oNode.getAspectImpact(\"mud\") == 1);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getAspects": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a read-only view of the node's ordered aspects. The aspect objects and their Protean impactors remain modifiable through their methods.<\/div><\/div><div class=\"custom-section\"><div id=\"b8d17c8c-5c13-92e2-e423-00286c3dd8d2\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tAspects<\/em>   The ordered aspect objects.<br><\/div><\/div><div class=\"custom-section\"><div id=\"64a4f863-630b-00ae-1757-cc3455ba6576\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    assert(#oNode.getAspects() == 1);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getEntryCost": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Calculates the entry cost for one rover. Each active aspect contributes base cost times its own intensity times the difference between rover aversion and affinity. Contributions are added to the base cost and the result is clamped to the configured cost bounds. Aspects do not compound on each other. This calculation does not check passability or spend movement points.<\/div><\/div><div class=\"custom-section\"><div id=\"96919fef-5158-d0fb-11bb-25553cba1e52\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   The rover whose affinities and aversions determine the cost.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9d053cad-815f-31ea-80b3-830a26f3b38e\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nCost<\/em>   The bounded entry cost for this rover.<br><\/div><\/div><div class=\"custom-section\"><div id=\"37f8832f-d8d0-4f76-ccdd-46a124e1a326\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    assert(oNode.getEntryCost(oRover) == 10);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getEntryCosts": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Calculates a separate entry cost for each supplied rover. Costs are indexed by rover and are not summed together. Does not check passability or spend movement points. No rovers produces an empty table.<\/div><\/div><div class=\"custom-section\"><div id=\"9a459a2b-bc03-fb6e-9f7c-b8f942ca4ff0\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover|table<\/em><\/strong>   <em>...<\/em>   Individual rovers, or one ordered table of rovers.<br><\/div><\/div><div class=\"custom-section\"><div id=\"c0168203-5f91-0364-ad9d-f7448517137b\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tCosts<\/em>   The entry costs indexed by rover object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d2119833-a95a-cf0a-ebfa-341e4639ff68\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oFirst = oNode.createRover();\n    local oSecond = oNode.createRover();\n    local tCosts = oNode.getEntryCosts({oFirst, oSecond});\n    assert(tCosts[oFirst] == 10 and tCosts[oSecond] == 10);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getNeighbors": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gathers edge-sharing neighbors and destinations of outgoing ports without duplicates or this node itself. Does not filter by passability or movement points. Hex and staggered diamond maps require explicit staggerAxis and staggerIndex settings. Hexagons have six neighbors; staggered diamonds have four slanted edge-sharing neighbors. Square maps use four edge-sharing neighbors. Triangular maps use three edge-sharing neighbors: even native x+y points up for flat triangles or left for pointed triangles; odd parity reverses the direction.<\/div><\/div><div class=\"custom-section\"><div id=\"d6d41be5-29a4-350d-db78-81227e337f10\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>boolean|nil<\/em><\/strong>   <em>bPhysicalOnly<\/em>   True excludes outgoing ports; defaults to false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e94151df-940e-9aa3-3e64-b14a20af9050\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tNeighbors<\/em>   A new ordered list of neighboring nodes. Physical neighbors precede ports; port order is unspecified.<br><\/div><\/div><div class=\"custom-section\"><div id=\"15726f2f-0715-4cb7-6a38-c222763b10b7\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    oNode.addPort(oMap.getNode(\"ground\", 3, 2), false);\n    assert(#oNode.getNeighbors() == 3 and #oNode.getNeighbors(true) == 2);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getOwner": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the layer that owns this node.<\/div><\/div><div class=\"custom-section\"><div id=\"3e66d674-d844-b720-d40b-46dfe5f21612\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarLayer<\/em><\/strong>   <em>oLayer<\/em>   The owning layer.<br><\/div><\/div><div class=\"custom-section\"><div id=\"ed014c36-bdb2-50ef-74bb-43df72235427\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    assert(oNode.getOwner() == oMap.getLayer(\"ground\"));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getPassable": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the node's general passability flag without checking any rover's restrictions.<\/div><\/div><div class=\"custom-section\"><div id=\"9128d515-d822-be77-1ac3-0669d804f1c7\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bPassable<\/em>   The general passability flag.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f2ac19ee-1e94-87de-2c4d-379301f425e3\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    oNode.setPassable(false);\n    assert(not oNode.getPassable());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getPortPassageRule": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the rule for this node's outgoing port. Node occupancy is independent of port passage.<\/div><\/div><div class=\"custom-section\"><div id=\"c28c1be0-38b1-fdba-4df1-33704e8eb4b6\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The port destination.<br><\/div><\/div><div class=\"custom-section\"><div id=\"6a766e46-f8b4-b053-c719-0f00ff194157\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>function|nil<\/em><\/strong>   <em>fRule<\/em>   The predicate, or nil for an unrestricted or absent port.<br><\/div><\/div><div class=\"custom-section\"><div id=\"fab37f3e-7ae2-0fa9-ebae-ca0db9d745c5\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oExit = oMap.getNode(\"ground\", 3, 2);\n    local fRule = function(oRover) return oRover.isType(\"goblin\"); end;\n    oNode.addPort(oExit, false, fRule);\n    assert(oNode.getPortPassageRule(oExit) == fRule);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getPorts": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a read-only view of this node's outgoing port connections. Keys are destination nodes and values are true. A connection appears here whether it is one-way or two-way.<\/div><\/div><div class=\"custom-section\"><div id=\"16849f06-ccda-b3e7-bb3e-47b9c3ae8000\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tPorts<\/em>   The outgoing connections, indexed by destination node.<br><\/div><\/div><div class=\"custom-section\"><div id=\"02a8fb27-e9c4-0fa6-90e9-f4042aa7c2de\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oExit = oMap.getNode(\"ground\", 3, 2);\n    oNode.addPort(oExit, false);\n    assert(oNode.getPorts()[oExit] == true);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getPos": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a new table containing the node's coordinates.<\/div><\/div><div class=\"custom-section\"><div id=\"dbce7ea0-2a10-df4d-c52d-b8ecb8f53546\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tPosition<\/em>   A table with x and y fields.<br><\/div><\/div><div class=\"custom-section\"><div id=\"5e24a6da-b563-563a-c0f2-61fe7d4f8862\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local tPosition = oNode.getPos();\n    assert(tPosition.x == 1 and tPosition.y == 1);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getRovers": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets a read-only view of the rovers occupying this node. Keys are rover objects and values are true.<\/div><\/div><div class=\"custom-section\"><div id=\"d738cf4d-b205-bac0-a518-f63405e156c6\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>table<\/em><\/strong>   <em>tRovers<\/em>   The resident rovers, indexed by rover object.<br><\/div><\/div><div class=\"custom-section\"><div id=\"d572a172-78d8-1963-4efe-3e2655a8233e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    assert(oNode.getRovers()[oRover] == true);<\/code><\/pre><\/div><\/div><\/div>`,

                "hasAspect": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether this node has an aspect using a case-insensitive name lookup.<\/div><\/div><div class=\"custom-section\"><div id=\"bdc18f58-da42-3b40-2672-8be1038400a4\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>string<\/em><\/strong>   <em>sAspect<\/em>   A nonblank aspect name.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9e0934bc-ea45-66e2-56ac-6641ccfce318\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bHasAspect<\/em>   Whether the aspect exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"21d178b7-dbf7-4851-8df5-7d8d332e6ae1\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    assert(oNode.hasAspect(\"mud\") and not oNode.hasAspect(\"snow\"));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null

                "hasPort": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether this node has an outgoing port to the supplied node. Does not require a reverse connection.<\/div><\/div><div class=\"custom-section\"><div id=\"b7f5581a-b0e4-a785-936e-4649cbb26c0f\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The destination node to check.<br><\/div><\/div><div class=\"custom-section\"><div id=\"a7e17fcc-d285-665f-8a7c-e25045c55278\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bHasPort<\/em>   Whether the outgoing connection exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2c0444b1-b8b0-e5b1-179a-34a754c14ed8\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oExit = oMap.getNode(\"ground\", 3, 2);\n    oNode.addPort(oExit, false);\n    assert(oNode.hasPort(oExit));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "hasPorts": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether this node has any outgoing port connections. Incoming-only connections do not count.<\/div><\/div><div class=\"custom-section\"><div id=\"e60d97df-3fe1-ed60-e85e-ec6f7dc2f93a\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bHasPorts<\/em>   Whether at least one outgoing connection exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7d589228-2a1f-87c2-7992-d210e4cf1c6c\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    assert(not oNode.hasPorts());\n    oNode.addPort(oMap.getNode(\"ground\", 3, 2));\n    assert(oNode.hasPorts());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "hasTwoWayPort": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether both nodes have an outgoing port to each other. Returns false immediately when either node has no outgoing ports.<\/div><\/div><div class=\"custom-section\"><div id=\"7b919743-30ed-120b-2387-7e037b551cd2\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The node to check.<br><\/div><\/div><div class=\"custom-section\"><div id=\"426c456a-eb8f-7777-b9df-d11f3a38462f\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bTwoWay<\/em>   Whether the connection exists in both directions.<br><\/div><\/div><div class=\"custom-section\"><div id=\"6da29005-d55c-782c-011c-f78022aedbea\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oExit = oMap.getNode(\"ground\", 3, 2);\n    oNode.addPort(oExit);\n    assert(oNode.hasTwoWayPort(oExit));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "isPassable": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether the node can be entered by every supplied rover. A false general passability flag blocks entry. Otherwise, entry is denied if any rover is forbidden from the layer, abhors an active aspect or a resident rover refuses entry to it. With no rovers supplied, returns the general passability flag. Movement points are not checked here.<\/div><\/div><div class=\"custom-section\"><div id=\"756297e2-1feb-ad97-9dcb-4044dc4b7cc6\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover|table<\/em><\/strong>   <em>...<\/em>   Individual rovers, or one table containing the rovers to check.<br><\/div><\/div><div class=\"custom-section\"><div id=\"02b73150-0591-a16f-a1bc-a4ca0ffccb14\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bPassable<\/em>   Whether all supplied rovers may enter.<br><\/div><\/div><div class=\"custom-section\"><div id=\"2901c8f1-b08a-7265-f195-dd6ae7f2a324\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    assert(oNode.isPassable(oRover));\n    oRover.setAbhors(\"mud\", true);\n    assert(not oNode.isPassable(oRover));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "removePort": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Removes an outgoing port connection. By default, also updates the reverse connection. A one-way operation leaves any existing reverse connection unchanged.<\/div><\/div><div class=\"custom-section\"><div id=\"8a0cdc5a-8e18-8135-9140-9ae8d02c84cc\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The connected node.   <strong><em>boolean|nil<\/em><\/strong>   <em>bTwoWay<\/em>   Whether to update both directions; defaults to true. False updates only this node's outgoing connection.<br><\/div><\/div><div class=\"custom-section\"><div id=\"072f5cf9-fb8f-e9c0-db0f-0c68bb663943\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   This node, for chaining.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1df88fd8-5330-56b8-fcfe-6ebf75e8155f\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oExit = oMap.getNode(\"ground\", 3, 2);\n    oNode.addPort(oExit);\n    oNode.removePort(oExit);\n    assert(not oNode.hasPort(oExit) and not oExit.hasPort(oNode));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setPassable": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets the node's general passability flag. Non-boolean inputs leave the flag unchanged. Rover-specific restrictions are still checked by isPassable when the flag is true.<\/div><\/div><div class=\"custom-section\"><div id=\"2bbe5b4b-8486-c004-c4fb-23e962db3ba2\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bPassable<\/em>   Whether the node is generally passable.<br><\/div><\/div><div class=\"custom-section\"><div id=\"a81bb4a6-98c3-866b-ca39-127dbf94c869\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>nil<\/em><\/strong>   <em>vReturn<\/em>   No return value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"78bb3b3b-8e41-f619-91c4-d19c330d73fd\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    oNode.setPassable(false);\n    assert(not oNode.isPassable());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "setPortPassageRule": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Sets or clears an existing outgoing port's rule. Does not change node passability. Each predicate receives (rover, sourceNode, destinationNode) and must return boolean. Keep it side-effect-free: planning may evaluate it repeatedly. A two-way update requires both directions to exist and uses the same function in each direction.<\/div><\/div><div class=\"custom-section\"><div id=\"dcffe3dc-3614-3f94-c5bf-4afea9762fde\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oNode<\/em>   The destination.   <strong><em>function|nil<\/em><\/strong>   <em>fRule<\/em>   The predicate; nil clears the restriction.   <strong><em>boolean|nil<\/em><\/strong>   <em>bTwoWay<\/em>   True updates both directions; defaults to false.<br><\/div><\/div><div class=\"custom-section\"><div id=\"a342be73-ea58-3ba8-ed53-02c4cb7149a8\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oSource<\/em>   This node.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7b5a30a8-d8d3-1a70-da98-254c13880644\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem   = AStar();\n    local oMap      = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\")}, 3, 1);\n    local oEntrance = oMap.getNode(\"ground\", 1, 1);\n    local oExit     = oMap.getNode(\"ground\", 3, 1);\n    oEntrance.addPort(oExit);\n    oEntrance.setPortPassageRule(oExit, function(oRover, oSource, oDestination)\n        return oRover.isType(\"goblin\");\n    end, true);\n    local oHuman = oEntrance.createRover();\n    assert(oEntrance.isPassable(oHuman) and not oEntrance.canUsePort(oExit, oHuman));\n    oHuman.addType(\"goblin\");\n    assert(oEntrance.canUsePort(oExit, oHuman));<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "togglePassable": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Inverts the node's general passability flag. Does not alter rover-specific restrictions.<\/div><\/div><div class=\"custom-section\"><div id=\"b8f9e139-eceb-f5a0-edf9-581fee5d3e01\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>nil<\/em><\/strong>   <em>vReturn<\/em>   No return value.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1bd2795b-e442-5b1b-3880-c6d00ecba879\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    oNode.togglePassable();\n    assert(not oNode.getPassable());<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                }
                }
            },
            "AStarPath": {
                "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   A planned group route. Construction searches passable nodes and outgoing ports without moving rovers or changing movement Pools. Costs remain separate per rover; route selection minimizes the largest individual total, then favors the longest prefix affordable by the entire group this turn. Node lists include the start, whose entry cost is not charged. Cycle 0 is the current turn; later cycle numbers describe future turns using each rover's capacity, regeneration and point-retention setting. Previews assume these settings and entry costs remain unchanged. Exact group search retains nondominated individual cost vectors; maps with many competing cost combinations can require substantially more time and memory than a single-rover search.<\/div><\/div><\/div>`,
                "subtable": {
                "AStarPath": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Plans a route for one or more distinct rovers at the start node. Endpoints must belong to the same AStar system. No route produces an empty node list and hasPath false; insufficient movement points do not prevent route construction.<\/div><\/div><div class=\"custom-section\"><div id=\"d02c32b9-3936-caa9-4a33-4d5052446b10\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarNode<\/em><\/strong>   <em>oStartNode<\/em>   The starting node.   <strong><em>AStarNode<\/em><\/strong>   <em>oEndNode<\/em>   The destination node.   <strong><em>AStarRover|table<\/em><\/strong>   <em>...<\/em>   Individual rovers or one contiguous ordered rover list.<br><\/div><\/div><div class=\"custom-section\"><div id=\"1604eac9-2a78-034d-b781-4c2537f49de1\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>AStarPath<\/em><\/strong>   <em>oPath<\/em>   The planned path.<br><\/div><\/div><div class=\"custom-section\"><div id=\"0f211b8b-ba88-0751-d4de-1295d17b967e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar();\n    local oMap    = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\")}, 3, 1);\n    local oStart  = oMap.getNode(\"ground\", 1, 1);\n    local oRover  = oStart.createRover();\n    oRover.getMovePointPool().set(20, Pool.ASPECT.MAX);\n    oRover.getMovePointPool().set(10, Pool.ASPECT.CYCLE_FLAT);\n    local oPath = AStar.Path(oStart, oMap.getNode(\"ground\", 3, 1), oRover);\n    assert(oPath.hasPath() and oPath.getNodeCount() == 3);\n    assert(oPath.getCycleForNode(3) == 2);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getCost": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the total entry cost captured during route construction for a member rover, excluding the start. Later cost changes and payments do not alter this planned total.<\/div><\/div><div class=\"custom-section\"><div id=\"cdf308c4-3e2a-769f-4405-672b8e1a7816\" class=\"section-title\">Parameter(s)<\/div><div class=\"section-content\">   <strong><em>AStarRover<\/em><\/strong>   <em>oRover<\/em>   A member of this path.<br><\/div><\/div><div class=\"custom-section\"><div id=\"4a1e57b2-79d9-67b0-c959-e3583b24b1f9\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nCost<\/em>   The rover's cumulative cost; zero when no route exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"e1f3a1b8-c44d-1aca-04a4-2d0078581480\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(100, Pool.ASPECT.MAX);\n    oPoints.setFull();\n    local oPath = AStar.Path(oNode, oMap.getNode(\"ground\", 3, 2), oRover);\n    assert(oPath.getCost(oRover) == 30);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getCostTotal": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets the largest individual cumulative cost captured during route construction, used to compare routes. This is not a sum of group members' costs or a group payment.<\/div><\/div><div class=\"custom-section\"><div id=\"d4c1272c-df8a-725c-1dbf-369c50b81280\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number<\/em><\/strong>   <em>nCost<\/em>   The route comparison cost; zero when no route exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"f348d88e-cae8-e3cb-6c18-c939d1734225\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(100, Pool.ASPECT.MAX);\n    oPoints.setFull();\n    local oPath = AStar.Path(oNode, oMap.getNode(\"ground\", 3, 2), oRover);\n    assert(oPath.getCostTotal() == 30);<\/code><\/pre><\/div><\/div><\/div>`,
                    "subtable": null
                },
                "getCycleCount": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Gets future cycles needed to reach the destination under the preview settings.<\/div><\/div><div class=\"custom-section\"><div id=\"0d37f2f0-8995-b0ac-4877-b79ecef1b40f\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>number|nil<\/em><\/strong>   <em>nCycles<\/em>   Zero when reachable now, or nil when no route exists or progress cannot finish with the current settings.<br><\/div><\/div><div class=\"custom-section\"><div id=\"9293639a-b96c-85dd-cc68-e39f5994911e\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(100, Pool.ASPECT.MAX);\n    oPoints.setFull();\n    local oPath = AStar.Path(oNode, oMap.getNode(\"ground\", 3, 2), oRover);\n    assert(oPath.getCycleCount() == 0);<\/code><\/pre><\/div><\/div><\/div>`,

                "getReachableNodeCount": {

                "hasPath": {
                    "value": `<div class=\"container-fluid\"><div class=\"custom-section\"><div class=\"section-title\">Description<\/div><div class=\"section-content\">   Checks whether a passable route was found, independently of movement points.<\/div><\/div><div class=\"custom-section\"><div id=\"07e5f6c5-3191-e7bd-f749-5c92107ad77e\" class=\"section-title\">Return(s)<\/div><div class=\"section-content\">   <strong><em>boolean<\/em><\/strong>   <em>bFound<\/em>   Whether the route exists.<br><\/div><\/div><div class=\"custom-section\"><div id=\"7d0ccfa3-ff6c-34fd-2de5-f2b6ad77cacb\" class=\"section-title\">Example <button class=\"copy-to-clipboard-button\" onclick=\"Dox.copyToClipboard(this)\">Copy<\/button><\/div><div class=\"section-content\">   <pre><code class=\"language-lua\">    local oSystem = AStar(\"mud\");\n    local oMap = oSystem.newMap(\"world\", ASTAR_MAP_TYPE_SQUARE, {AStar.LayerConfig(\"ground\", \"mud\")}, 3, 2);\n    local oNode = oMap.getNode(\"ground\", 1, 1);\n    local oRover = oNode.createRover();\n    local oPoints = oRover.getMovePointPool();\n    oPoints.set(100, Pool.ASPECT.MAX);\n    oPoints.setFull();\n    local oPath = AStar.Path(oNode, oMap.getNode(\"ground\", 3, 2), oRover);\n    assert(oPath.hasPath());<\/code><\/pre><\/div><\/div><\/div>`,
